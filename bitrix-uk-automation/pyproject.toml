[project]
name = "bitrix-uk-automation"
version = "0.1.0"
description = "Наполнение и ведение смарт-процесса «Дома» в Битрикс24 для УК СВ, УК СОЮЗ и ДОМОВОЙ"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bitrix-uk = "bitrix_uk.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
