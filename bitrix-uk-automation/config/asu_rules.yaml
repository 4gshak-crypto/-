# Правила разбора журнала заявок АСУ «Жилищный стандарт».
# Регулярные выражения проверяются без учёта регистра, «ё» заменяется на «е».
# Правила можно дополнять: программа покажет в предпросмотре, какое правило сработало.

# Аварии (критичные заявки)
critical:
  types:                       # тип заявки АСУ, при котором заявка всегда авария
    - Устранение затопления
    - Устранение течи в системах ХВС
    - Акт о залитии квартиры
  keywords:                    # причина: выражение по тексту заявки; unless — исключение
    затопление: 'затоп|заливает|залива[ею]т|\bтопит\b|течь? с потолка|течет с потолка|капает с (потолка|верху|сверху)|хл[еы]щ'
    порыв: 'порыв|прорыв|лопнул|свищ'
    нет отопления:             # «в доме» — авария, «в комнате/квартире» — нет
      pattern: 'нет отоплени|пропало отоплени|отсутству\w* отоплени|не работает отоплени'
      unless: 'квартир|\bкв\b|комнат|ванн|кухн|спальн|зал[еу]?\b'
    пожарная сигнализация: 'пожарн\w* сигнализ|сработал\w* сигнализ|аппз|дымоудален'
    запах гари: '\bгар[ьи]\b|гарью|запах дыма|задымлен|дым в подъезде'
    лифт:                      # остановка лифта, а не освещение возле него
      pattern: 'лифт\w*\s+(не\s+работа|не\s+едет|застрял|стоит|останов|встал)|застрял\w*\s+в\s+лифт|не\s+работа\w*\s+(\w+\s+)?лифт'
    колодцы и КНС: 'колод|\bкнс\b'

# Система дома (справочник «Конструктив и системы»)
systems:
  by_type:                     # тип заявки АСУ → система; если тип общий («Сантехника») — смотрим текст
    Обслуживание систем отопления: Отопление и ИТП
    Обслуживание систем горячего водоснабжения: ГВС
    Устранение течи в системах ГВС: ГВС
    Обслуживание систем холодного водоснабжения: ХВС
    Устранение течи в системах ХВС: ХВС
    Обслуживание систем водоотведения (канализации): Водоотведение и КНС
    Прочистка канализации: Водоотведение и КНС
    Электрика: Электроснабжение и освещение
    Отсутствие освещения в МОП (в т.ч. замена ламп): Электроснабжение и освещение
    Вентиляция: Вентиляция и дымоудаление
    Ремонт дверей (в т.ч. дверных приборов): Окна, двери, входные группы
    Ремонт окон (в т.ч. оконных приборов): Окна, двери, входные группы
    Засор мусоропровода: Мусоропровод
    Мойка мусорокамер: Мусоропровод
    Дезинсекция и дератизация: Санитарное содержание
    Уборка придомовой территории: Придомовая территория и благоустройство
    Благоустройство: Придомовая территория и благоустройство
    Домофоны: Слаботочные системы
    Устранение неисправности в работе домофона: Слаботочные системы
    Открытие/закрытие чердака, подвала, тех.этажа: Прочее
    Предоставление доступа: Прочее
    Документы: Прочее
    Ремонт межпанельных швов: Стены и фасад
    Ремонт входной группы: Окна, двери, входные группы
    Уборка мест общего пользования: Санитарное содержание
    Уборка контейнерной площадки: Придомовая территория и благоустройство
    Вывоз мусора: Придомовая территория и благоустройство
    Обрезка деревьев/кустарников: Придомовая территория и благоустройство
    Покос травы: Придомовая территория и благоустройство
    Устранение неисправности в работе системы видеонаблюдения: Слаботочные системы
  keywords:                    # по порядку: первое совпадение по тексту заявки
    Отопление и ИТП: 'отоплен|стояк\w* цо|\bцо\b|радиатор|батаре|воздухоотвод|итп|элеватор'
    ГВС: '\bгвс\b|горяч|полотенцесуш|поло/суш|\bп/с\b'
    ХВС: '\bхвс\b|холодн\w* вод'
    Водоотведение и КНС: 'канализ|засор|колод|\bкнс\b|выпуск|лежак'
    Электроснабжение и освещение: 'свет|электр|автомат|розетк|ламп|светильник|искрит|щит'
    Лифты: 'лифт'
    Кровля и козырьки: 'кровл|крыш|козыр|протека\w* с крыши'
    Слаботочные системы: 'домофон|видеонаблюд'
    Вентиляция и дымоудаление: 'вентиляц|вытяжк|\bдвк\b|дымоход'
    Окна, двери, входные группы: 'двер|окн|доводчик'
    Мусоропровод: 'мусоропровод|мусорокамер'
    Санитарное содержание: 'дезинс|дератиз|тарака|крыс|клоп'

# Третьи стороны
third_party:
  status: Третья сторона       # статус АСУ «Третья сторона»
  transfer: 'переда'           # слово в комментарии, означающее передачу
  recipients:                  # по порядку: комментарий, затем тип, затем текст заявки
    Водоканал: 'водоканал|колод|\bкнс\b'
    Т Плюс: 'т ?плюс|т\+|теплосет'
    Домофонная организация: 'домофон'
    Дезинфекция: 'дез ?инфект|дезинс|дератиз'
    Лифтовая организация: 'лифт'
    Провайдер: 'провайдер|интернет|ростелеком|дом\.ру|билайн|мтс'

# Повторяющиеся проблемы: столько заявок по одной системе дома за столько дней
repeats:
  days: 30
  min_count: 3
