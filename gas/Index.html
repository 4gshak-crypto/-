<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер текущего ремонта</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: шапка с вкладками; «Сводка» сверху вниз отвечает на вопросы: где мы (стадии) → где проблемы → когда (месяцы) → кто отстаёт → где (адреса, виды работ); «Работы» — список с быстрыми фильтрами по стадиям, детали в боковой панели */
:root{
  --bg:#f3f4f2; --surface:#fff; --surface-2:#eceeea; --line:#dde1da; --line-strong:#bcc2b8;
  --fg:#1d2420; --muted:#5b665f; --faint:#8a948d;
  --accent:#1f5f8b; --accent-ink:#fff; --accent-soft:#dde9f2;
  /* стадии: метка на графике · текст · подложка. Палитра проверена на различимость соседних стадий, в том числе при дальтонизме */
  --todo:#8b939b; --todo-ink:#4f5860; --todo-bg:#eceef0;
  --prog:#1859a6; --prog-ink:#164f93; --prog-bg:#e1ebf7;
  --noact:#d29b00; --noact-ink:#7f5b00; --noact-bg:#faf0d2;
  --done:#2e7d3a; --done-ink:#256b30; --done-bg:#e0f1e2;
  --winter:#8a5cc2; --winter-ink:#6d45a6; --winter-bg:#efe8f8;
  --attn:#c0392b; --attn-ink:#a8321f; --attn-bg:#fbe5e1;
  --cancel:#a3a8a4; --cancel-ink:#6b716d; --cancel-bg:#eceeec;
  --ex-pto:#4f5f6b; --ex-own:#a9530b; --ex-none:#8a948d;
  --banner:#fbefd6;
  --shadow:0 10px 40px rgba(20,30,25,.18);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --surface:#1c2320; --surface-2:#252d29; --line:#2f3833; --line-strong:#47524b;
  --fg:#e5ebe7; --muted:#a3ada7; --faint:#77827b; --accent:#6fb0de; --accent-ink:#0d1b25; --accent-soft:#1d3342;
  --todo:#5d6772; --todo-ink:#b4bcc4; --todo-bg:#2a3036; --prog:#4893e3; --prog-ink:#8ec0f5; --prog-bg:#1b2f47;
  --noact:#cfa22e; --noact-ink:#f0cc6a; --noact-bg:#3a2f12; --done:#2a8040; --done-ink:#7fd08c; --done-bg:#1b3520;
  --winter:#8f74d8; --winter-ink:#c4b2f2; --winter-bg:#2c2540; --attn:#d95a49; --attn-ink:#ff9b8c; --attn-bg:#3d1f1b;
  --cancel:#6f7672; --cancel-ink:#a4aba7; --cancel-bg:#2a302c; --ex-pto:#a9b8c3; --ex-own:#f3a35e; --ex-none:#77827b;
  --banner:#3a2d12; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
[hidden]{display:none!important}

/* shell */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs button{border:0;background:none;padding:18px 12px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.who{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:13px}
.role{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
@media (max-width:720px){.brand{display:none}.who .nm,.who .role{display:none}.bar-in{gap:8px}.tabs button{padding:18px 9px 16px}}

.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.ctl{padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.2}
.err{color:var(--attn-ink);font-size:13px;min-height:18px}
.hint{font-size:12px;color:var(--faint)}

/* цвета стадий и исполнителей: --c метка, --ci текст, --cb подложка */
.g-todo{--c:var(--todo);--ci:var(--todo-ink);--cb:var(--todo-bg)} .g-prog{--c:var(--prog);--ci:var(--prog-ink);--cb:var(--prog-bg)}
.g-noact{--c:var(--noact);--ci:var(--noact-ink);--cb:var(--noact-bg)} .g-done{--c:var(--done);--ci:var(--done-ink);--cb:var(--done-bg)}
.g-winter{--c:var(--winter);--ci:var(--winter-ink);--cb:var(--winter-bg)} .g-attn{--c:var(--attn);--ci:var(--attn-ink);--cb:var(--attn-bg)}
.g-cancel{--c:var(--cancel);--ci:var(--cancel-ink);--cb:var(--cancel-bg)}
.e-pto{--ci:var(--ex-pto)} .e-own{--ci:var(--ex-own)} .e-none{--ci:var(--ex-none)}
.fill{background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ci);background:var(--cb)}
.pill.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;font-weight:600;color:var(--ci)}
.chkpill{font-size:10px;font-weight:600;border:1px dashed var(--line-strong);color:var(--muted);border-radius:999px;padding:0 7px;white-space:nowrap}
.bad{color:var(--attn-ink);font-weight:600}

/* сводка */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:16px}
.head h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card+.card,.grid2+.card,.card+.grid2,.grid2+.grid2{margin-top:12px}
.card h3{margin:0;font-size:15px;font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.card h3 span{font-weight:400;color:var(--muted);font-size:12px}
.card .sub{font-size:12px;color:var(--muted);margin:2px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2>.card{margin-top:0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px;margin:10px 0 14px}
.hero-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-big{font-family:var(--f-display);font-size:34px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.hero-txt{font-size:14px;max-width:60ch}
.money{font-size:12px;color:var(--muted)}
.pipe{display:flex;gap:2px;height:28px}
.pipe span{min-width:4px;background:var(--c)}
.pipe span:first-child{border-radius:6px 0 0 6px} .pipe span:last-child{border-radius:0 6px 6px 0}
.pipe .gap{flex:0 0 8px;background:transparent;min-width:0}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) repeat(2,minmax(0,.85fr));column-gap:22px;row-gap:10px;margin-top:12px}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.stage:hover{border-color:var(--c)}
.stage.side{border-style:dashed}
.stage.arrow::after{content:"→";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px}
.stage .sh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ci)}
.stage .sh i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.stage .sn{font-family:var(--f-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stage .sp{font-size:12px;color:var(--muted)}
.stage .sx{font-size:12px;font-weight:600;color:var(--attn-ink);min-height:18px}
.stage .sx.ok{color:var(--muted);font-weight:400}
@media (max-width:900px){.stages{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px}.stage.arrow::after{display:none}}
.note{font-size:12px;color:var(--faint);margin:10px 0 0}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:4px 56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 0;border-top:1px solid var(--line);cursor:pointer}
.plist li:first-child{border-top:0}
.plist li:hover{background:var(--surface-2)}
.plist .sv{align-self:stretch;border-radius:2px;background:var(--c)}
.plist .pn{font-family:var(--f-display);font-size:20px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.plist .pt{min-width:0} .plist .pt b{display:block;font-size:13px;font-weight:600} .plist .pt span{font-size:12px;color:var(--muted)}
.plist .pa{font-size:12px;color:var(--accent);white-space:nowrap}
.sev-high{--c:var(--attn)} .sev-mid{--c:var(--noact)} .sev-low{--c:var(--todo)}
@media (max-width:560px){.plist .pa{display:none}.plist li{grid-template-columns:4px 44px minmax(0,1fr);gap:10px}}
.mrow{display:grid;grid-template-columns:168px minmax(0,1fr) 104px;gap:10px;align-items:center;padding:6px 4px;cursor:pointer;border-radius:6px}
.mrow:hover{background:var(--surface-2)}
.mrow .ml{font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.mb{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;font-style:normal}
.mb.late{color:var(--attn-ink);background:var(--attn-bg)} .mb.now{color:var(--prog-ink);background:var(--prog-bg)}
.mb.ok{color:var(--done-ink);background:var(--done-bg)} .mb.next{color:var(--muted);background:var(--surface-2)} .mb.wait{color:var(--noact-ink);background:var(--noact-bg)}
.mrow .mv{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.mrow{grid-template-columns:120px minmax(0,1fr) 72px}.mrow .mv span{display:none}}
.stack{display:flex;gap:2px;height:14px}
.stack span{height:100%;min-width:3px;background:var(--c)}
.stack span:first-child{border-radius:4px 0 0 4px} .stack span:last-child{border-radius:0 4px 4px 0} .stack span:only-child{border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.tscroll{overflow-x:auto;margin:0 -4px}
.wt{width:100%;border-collapse:collapse;font-size:13px;min-width:780px}
.wt th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.wt th i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:4px}
.wt th:first-child,.wt td:first-child{text-align:left}
.wt td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wt tbody tr{cursor:pointer} .wt tbody tr:hover{background:var(--surface-2)}
.wt .z{color:var(--faint)}
@media (max-width:640px){.wt{min-width:0}.wt .st{display:none}.wt th,.wt td{padding:8px 5px}.wt th,.wt td:first-child{white-space:normal}.wt .pbar{gap:6px}.wt .pbar i{width:30px}}
.pbar{display:inline-flex;align-items:center;gap:8px} .pbar i{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i b{display:block;height:100%;background:var(--done)}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 34px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.hbar .lbl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar:hover .lbl{color:var(--accent)}
.hbar .tr{height:10px}
.hbar .tr i{display:block;height:100%;background:var(--attn);border-radius:0 4px 4px 0;min-width:3px}
.hbar .val{font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.alist li:first-child{border-top:0}
.alist li:hover .a{color:var(--accent)}
.alist .a{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist .m{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.hbar{grid-template-columns:minmax(0,120px) minmax(0,1fr) 30px}.alist li{flex-direction:column;align-items:flex-start;gap:4px}.alist .a{max-width:100%}}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap}

.hrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px}

/* работы */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters .ctl{width:auto;flex:0 1 auto}
.filters .search{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--fg)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)} .chip[aria-pressed="true"] b{color:var(--bg)}
.fpills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.fpill{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:3px 4px 3px 10px}
.fpill button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 5px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;user-select:none}
.count{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wr{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 0;border-top:1px solid var(--line);cursor:pointer}
.wr:first-child{border-top:0}
.wr:hover{background:var(--surface-2)}
.wr .sev{align-self:stretch;background:var(--c)}
.wr .a{font-weight:600;font-size:13px}
.wr .w{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wr .od{font-size:11px;color:var(--attn-ink);font-weight:600}
.wr .al{font-size:11px;color:var(--noact-ink);font-weight:600}
.lock{font-size:11px;color:var(--faint)}
.more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);cursor:pointer;font-weight:500}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* панель работы */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:16px;line-height:1.3}
.dh .x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.db{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.steps{display:flex;list-style:none;margin:0;padding:0;gap:4px}
.steps li{flex:1;font-size:11px;color:var(--faint);text-align:center;position:relative;padding-top:12px}
.steps li::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:3px;background:var(--surface-2)}
.steps li.past::before,.steps li.cur::before{background:var(--c)}
.steps li.cur{color:var(--fg);font-weight:600}
.stop{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--cb);color:var(--ci)}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;word-break:break-word}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.box.chkbox{border-style:dashed;border-color:var(--line-strong);background:var(--surface-2)}
.box h4{margin:0;font-size:13px}
.hist{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.df .msg{font-size:12px;color:var(--muted);margin-left:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.phcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.phc h5{margin:0 0 6px;font-size:12px;font-weight:600}
.phg{display:flex;flex-wrap:wrap;gap:6px}
.pht{width:64px;height:64px;padding:0;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.pht img{width:100%;height:100%;object-fit:cover;display:block}
.pha{position:relative;width:64px;height:64px;border:1px dashed var(--line-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;cursor:pointer}
.pha input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pha:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pha.off{opacity:.45;pointer-events:none}
.lbx{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}
.lbs{position:absolute;inset:0;background:rgba(10,15,12,.86)}
.lbx figure{position:relative;margin:0;max-width:min(94vw,980px);max-height:94vh;display:flex;flex-direction:column;gap:10px;align-items:center}
.lbimg{min-height:100px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.lbimg img{max-width:100%;max-height:70vh;border-radius:6px;background:#000}
.lbx figcaption{color:#fff;font-size:13px;text-align:center}
.lbb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lbb a.btn{text-decoration:none;color:inherit}
.imp-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.imp-row:first-of-type{border-top:0}
.imp-row small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.imp-row b{font-family:var(--f-display);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.imp-row.zero,.imp-row.zero small{color:var(--faint)}
.imp-det{font-size:12px;color:var(--muted)} .imp-det summary{cursor:pointer;color:var(--accent);padding:2px 0}
.imp-det ul{margin:6px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.imp-err{color:var(--attn-ink);font-size:13px}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:end}
.xn{font-size:12px;margin:-8px 0 0;min-height:14px;overflow-wrap:anywhere}
.imp-info{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}

/* вопросы, журнал, пользователи */
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.ilist li:first-child{border-top:0}
.ilist .t{font-size:13px}
.ilist .done .t{color:var(--faint);text-decoration:line-through}
.ilist .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.loglist li{grid-template-columns:minmax(0,1fr)}
.utable{width:100%;border-collapse:collapse;font-size:13px}
.utable th,.utable td{text-align:left;padding:10px 14px;border-top:1px solid var(--line)}
.utable th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.uform{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:10px;align-items:end;margin-top:12px}
@media (max-width:760px){.uform,#qf{grid-template-columns:1fr 1fr!important}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40}
.demo{background:var(--banner);color:var(--fg);font-size:12px;text-align:center;padding:6px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* merge:start */
/* Сведение трёх выгрузок Excel в файл обновления трекера.
   Порт tools/merge_sources.py, tools/srcnorm.py и части tools/extract_backlog.py: результат должен совпадать с Python до буквы,
   иначе ключи работ разойдутся и загрузка перестанет находить старые строки. Проверка: tools/test_merge_js.js.
   Работает в браузере и в Node; библиотека чтения Excel (SheetJS) передаётся через setLib().
   Править здесь, а не в Index.html: build.py вставляет этот файл в Index.html между метками merge:start и merge:end. */
var TrackerMerge = (function () {
  'use strict';
  var X = null;
  var W = '[\\p{L}\\p{N}_]';                       // «буква слова» в смысле \w из Python (Юникод)
  var B_BEFORE = '(?<!' + W + ')', B_AFTER = '(?!' + W + ')';
  var MONTHS_RU = { 'Январь': 1, 'Февраль': 2, 'Март': 3, 'Апрель': 4, 'Май': 5, 'Июнь': 6, 'Июль': 7, 'Август': 8,
    'Сентябрь': 9, 'Октябрь': 10, 'Ноябрь': 11, 'Декабрь': 12 };
  var MASTERS = [  // фамилия -> как показывать (порядок важен)
    ['гайдуков', 'Гайдуков А.В.'], ['зеленцов', 'Зеленцов А.В.'], ['сандюк', 'Сандюк Ю.В.'], ['вазюков', 'Вазюков В.С.'],
    ['шарафутдинов', 'Шарафутдинов Р.Р.'], ['евграфов', 'Евграфов С.В.'], ['алиев', 'Алиев Р.Р.'], ['чернов', 'Чернов Р.А.'],
    ['наумова', 'Наумова Т.Ю.'], ['братчинин', 'Братчинин Н.А.'], ['мастер', 'Мастер участка (Север)']];
  var SOURCES = ['exec', 'per', 'plan', 'add', 'bx'];   // порядок при одинаковой дате: позже в списке — свежее

  function setLib(lib) { X = lib; }
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function rall(s, a, b) { return s.split(a).join(b); }          // str.replace из Python заменяет все вхождения

  /* ---------- значения ячеек как в Python ---------- */
  // Date у нас — даты Excel; str(datetime) в Python даёт «2026-10-01 00:00:00»

  function num(v) { return typeof v === 'number' && v ? v : null; }
  function money(v, xls) {

    var s = rall(rall(rall(rall(sp(v, xls), '₽', ''), ' ', ''), ' ', ''), ',', '.');

  function dmy(d) { return pad2(d.getUTCDate()) + '.' + pad2(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear(); }

  /* ---------- адреса и тексты работ (srcnorm.py) ---------- */
  var STREET_TYPES = '(улица|проспект|пр-кт|пр-т|пр-д|проезд|шоссе|переулок|бульвар|б-р|площадь|ул|пр|ш|пер|пл|д)';
  var HOUSE = '(\\d+(?:\\s*[а-я](?![а-я]))?(?:\\s*/\\s*\\d+(?:\\s*[а-я](?![а-я]))?)?)';

  var RE_THIRD = new RegExp(B_BEFORE + 'третьего' + B_AFTER, 'gu');

  function addrKey(a) {

    s = rall(rall(s, 'ё', 'е'), ' ', ' ').trim();
    s = s.replace(/50\s*-?\s*(летия|лет)/g, '50 лет');
    s = rall(s.replace(RE_THIRD, '3'), 'уица ', 'улица ');
    s = rall(rall(rall(rall(s, 'промышленая', 'промышленная'), 'пушкаревау', 'пушкарева'), 'роьеспьера', 'робеспьера'), 'люксембур ', 'люксембург ');
    var street, m, c = s.indexOf(',');

    ['ремонтсист', 'ремонт сист'], ['ремонткровл', 'ремонт кровл'], ['кварна', 'крана'], ['прочитск', 'прочистк']];
  function workNorm(w) {
    var s = rall((w ? String(w) : '').toLowerCase(), 'ё', 'е');

      Array.from(b2j.keys()).forEach(function (k) { if (b2j.get(k).length > ntest) b2j.delete(k); });
    }
    function longest(alo, ahi, blo, bhi) {
      var besti = alo, bestj = blo, bestsize = 0, j2len = new Map(), nothing = [];
      for (var i = alo; i < ahi; i++) {
        var newj2len = new Map(), js = b2j.get(a[i]) || nothing;
        for (var q = 0; q < js.length; q++) {
          var j = js[q];
          if (j < blo) continue;
          if (j >= bhi) break;
          var k = (j2len.get(j - 1) || 0) + 1;
          newj2len.set(j, k);
          if (k > bestsize) { besti = i - k + 1; bestj = j - k + 1; bestsize = k; }
        }
        j2len = newj2len;
      }
      while (besti > alo && bestj > blo && a[besti - 1] === b[bestj - 1]) { besti--; bestj--; bestsize++; }
      while (besti + bestsize < ahi && bestj + bestsize < bhi && a[besti + bestsize] === b[bestj + bestsize]) bestsize++;

    while (queue.length) {
      var t = queue.pop(), m = longest(t[0], t[1], t[2], t[3]);
      if (m[2]) {

        if (t[0] < m[0] && t[2] < m[1]) queue.push([t[0], m[0], t[2], m[1]]);
        if (m[0] + m[2] < t[1] && m[1] + m[2] < t[3]) queue.push([m[0] + m[2], t[1], m[1] + m[2], t[3]]);

  var wnCache = {};
  function wn(w) { var r = wnCache[w]; if (r === undefined) r = wnCache[w] = workNorm(w); return r; }
  function workSim(a, b) {
    a = wn(a); b = wn(b);
    if (!a || !b) return 0.0;
    if (a === b) return 1.0;
    var r = ratio(a, b), ta = new Set(a.split(/\s+/).filter(Boolean)), tb = new Set(b.split(/\s+/).filter(Boolean)), inter = 0;
    ta.forEach(function (x) { if (tb.has(x)) inter++; });
    var union = ta.size + tb.size - inter, j = inter / Math.max(1, union);
    var na = new Set(a.match(/\d+/g) || []), nb = new Set(b.match(/\d+/g) || []), common = false;

  }

  /* ---------- нормализация из extract_backlog.py ---------- */
  function normAddr(a, xls) {
    a = pstr(a, xls).replace(/\s+/g, ' ').trim();
    a = a.replace(/,(?=\S)/g, ', ');
    a = a.replace(new RegExp('(\\d)([а-яё])' + B_AFTER, 'gu'), function (m, d, l) { return d + l.toUpperCase(); });
    return rall(rall(rall(a, 'проезд', 'пр-д'), '50 лет ВЛКСМ', '50-летия ВЛКСМ'), ' корпус ', ' корп. ');
  }
  var UK_KNOWN = { 'ук св': 'УК «СВ»', 'ук союз': 'УК «Союз»', 'ук домовой': 'УК «Домовой»', 'ук домок': 'УК «Домок»', 'тсж звезда': 'ТСЖ «Звезда»', 'тсж зведа': 'ТСЖ «Звезда»' };
  function normUk(u, xls) {
    u = u ? pstr(u, xls) : '';
    u = u.replace(/^ООО\s*/, '').trim().replace(/^["«»]+|["«»]+$/g, '');
    u = rall(rall(rall(u, '"', ''), '«', ''), '»', '');
    u = u.replace(/\s+/g, ' ').trim();
    return has(UK_KNOWN, u.toLowerCase()) ? UK_KNOWN[u.toLowerCase()] : u;
  }
  var CATS = [
    ['ТРЖ', B_BEFORE + 'ТРЖ' + B_AFTER], ['Приборы учёта', 'УУТЭ|ОДПУ|прибор' + W + '* учет|расходомер|поверк|калибров'],
    ['Кровля и козырьки', 'кровл|козыр|крыш'], ['Фасад и МПШ', 'МПШ|межпанел|фасад|балкон'],
    ['Электрика', 'светил|освещ|электр|ВРУ|прожектор|домофон|кабел'],
    ['Инженерные сети', 'стоя|ГВС|ХВС|ЦО' + B_AFTER + '|канализ|КНС|розлив|трубопров|радиатор|насос|кран|вентил|задвиж|отоплен|фильтр|ИТП'],
    ['Двери, окна, входные группы', 'двер|окн|входн|рам[ыа]?' + B_AFTER + '|фрамуг|стекл'],
    ['Благоустройство', 'плитк|асфальт|крыл|отмост|дерев|лавоч|скамей|урн|площадк|забор|МАФ|столбик|полусфер|клумб|газон|песк|удобрен'],
    ['Подъезды', 'подъезд|л/к|лестн|покраск|побелк|штукатур'], ['Санитарное содержание', 'мусор|уборк|дезинс|дератиз']
  ].map(function (c) { return [c[0], new RegExp(c[1], 'iu')]; });
  function catOf(work) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i][1].test(work)) return CATS[i][0];
    return 'Прочее';
  }

  /* ---------- SHA-1 (ключ работы: sha1(...)[:10]) ---------- */
  function utf8(s) {
    var o = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.codePointAt(i);
      if (c > 0xffff) i++;

      else if (c < 0x800) o.push(0xc0 | c >> 6, 0x80 | c & 63);
      else if (c < 0x10000) o.push(0xe0 | c >> 12, 0x80 | c >> 6 & 63, 0x80 | c & 63);

    var m = utf8(s), l = m.length, h = [0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476, 0xc3d2e1f0], i, j;
    m.push(0x80);
    while (m.length % 64 !== 56) m.push(0);
    var hi = Math.floor(l * 8 / 0x100000000), lo = (l * 8) >>> 0;
    m.push(hi >>> 24 & 255, hi >>> 16 & 255, hi >>> 8 & 255, hi & 255, lo >>> 24 & 255, lo >>> 16 & 255, lo >>> 8 & 255, lo & 255);

  /* ---------- чтение листов ---------- */
  var INDEXED = ['000000', 'FFFFFF', 'FF0000', '00FF00', '0000FF', 'FFFF00', 'FF00FF', '00FFFF', '000000', 'FFFFFF', 'FF0000', '00FF00', '0000FF', 'FFFF00', 'FF00FF', '00FFFF',
    '800000', '008000', '000080', '808000', '800080', '008080', 'C0C0C0', '808080', '9999FF', '993366', 'FFFFCC', 'CCFFFF', '660066', 'FF8080', '0066CC', 'CCCCFF',
    '000080', 'FF00FF', 'FFFF00', '00FFFF', '800080', '800000', '008080', '0000FF', '00CCFF', 'CCFFFF', 'CCFFCC', 'FFFF99', '99CCFF', 'FF99CC', 'CC99FF', 'FFCC99',
    '3366FF', '33CCCC', '99CC00', 'FFCC00', 'FF9900', 'FF6600', '666699', '969696', '003366', '339966', '003300', '333300', '993300', '993366', '333399', '333333'];

    if (x.t === 'n' && x.z && X.SSF.is_date(x.z)) return new Date(Math.round(x.v * 86400) * 1000 + Date.UTC(1899, 11, 30));

  };
  Sheet.prototype.row = function (r, n) { var o = []; for (var c = 0; c < (n || this.ncols); c++) o.push(this.val(r, c)); return o; };

  function find(list, re) { for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i]; return null; }
  function dateOfName(name) {
    var m = /(\d\d)\.(\d\d)\.(\d{4})/.exec(name);
    return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
  }

  // ---------- годовой план ----------

      if (fdiff) check.push('факт: в плане ' + ru(p.fsum) + ' ₽, у исполнителей ' + ru(e.fsum) + ' ₽');
      var bxDates = '';

        if (b.start && b.end && b.end < b.start) bxDates += ' (завершение раньше начала)';
      }

      var hist = cand.map(function (c) { return c.label + ': ' + c.status; }).join(' → ');

        ex: ex, master: master, status: status, act: act, kr: '', bx_stage: b ? b.stage : '', bx_dates: bxDates,

    });

    var rcount = {};

      warnings: warnings

  }

  return { setLib: setLib, merge: merge, addrKey: addrKey, workNorm: workNorm, workSim: workSim, ratio: ratio, sha1hex: sha1hex, keyOf: keyOf, catOf: catOf, normAddr: normAddr, normUk: normUk,
    dateOfName: dateOfName };
})();

function monthRows(all){

    const d=l.filter(isDone).length,op=l.filter(i=>!i.closed).length,na=l.filter(i=>i.g==="noact").length;

/* ---------- фото «до» и «после» ---------- */
const PH_T=[["до","До"],["после","После"]];
const PHC={};   // номер фото -> data-URL полного снимка (чтобы не качать повторно)
// снимок перекладывается на холст и сжимается до JPEG: полный (до 1600 px) и миниатюра (160 px)
function phScale(im,max,q){
  const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,k=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q).split(",")[1];
}
function phPrepare(f){
  if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name))return Promise.reject(new Error("«"+f.name+"» — не картинка."));
  if(f.size>30e6)return Promise.reject(new Error("«"+f.name+"» больше 30 МБ."));
  return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);try{res({full:phScale(im,1600,.82),thumb:phScale(im,160,.6),name:f.name});}catch(e){rej(e);}};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("«"+f.name+"»: не удалось открыть снимок (формат не поддерживается, например HEIC). Сохраните его как JPEG."));};
    im.src=u;});
}
const phFull=id=>PHC[id]?Promise.resolve(PHC[id]):call("getPhoto",S.token,id).then(r=>PHC[id]="data:"+r.mime+";base64,"+r.data);
function phHtml(D,it){
  if(!REAL)return"";

  const col=t=>{const ps=(list||[]).filter(p=>p.type===t[0]);
    return'<section class="phc"><h5>'+t[1]+' <span class="faint">'+ps.length+'</span></h5><div class="phg">'+
      ps.map(p=>'<button type="button" class="pht" data-pid="'+esc(p.id)+'" aria-label="Открыть фото «'+t[1].toLowerCase()+'»"><img alt="" src="data:image/jpeg;base64,'+esc(p.thumb)+'"></button>').join("")+
      (ed?'<label class="pha'+(D.phBusy?" off":"")+'" title="Добавить фото «'+t[1].toLowerCase()+'»"><span aria-hidden="true">+</span><input type="file" accept="image/*" multiple data-pt="'+t[0]+'" aria-label="Добавить фото «'+t[1].toLowerCase()+'»"'+(D.phBusy?" disabled":"")+'></label>':"")+
      (!ps.length&&!ed?'<span class="faint" style="font-size:12px">нет</span>':"")+'</div></section>';};
  return'<div class="box" id="dph"><h4>Фото</h4>'+(list==null?'<div class="faint" style="font-size:12px">Загружаю…</div>':'<div class="phcols">'+PH_T.map(col).join("")+'</div>')+
    (D.phMsg?'<div class="'+(D.phErr?"imp-err":"faint")+'" style="font-size:12px" role="status">'+esc(D.phMsg)+'</div>':"")+'</div>';
}
function refreshPh(D,it){const el=$("dph");if(el&&V.drawer===D){el.outerHTML=phHtml(D,it);phBind(D,it);}}
function phBind(D,it){
  const root=$("dph");if(!root)return;
  root.querySelectorAll(".pht").forEach(b=>b.onclick=()=>phOpen(D,it,b.dataset.pid));
  root.querySelectorAll("input[data-pt]").forEach(inp=>inp.onchange=()=>{if(inp.files.length)phUpload(D,it,inp.dataset.pt,Array.from(inp.files));});
  if(D.photos===undefined){D.photos=null;
    call("listPhotos",S.token,it.key).then(l=>{D.photos=l;refreshPh(D,it);}).catch(e=>{D.photos=[];D.phMsg=e.message;D.phErr=true;refreshPh(D,it);});}
}
function phUpload(D,it,type,files){
  const total=files.length,fails=[];let n=0;
  D.phBusy=true;D.phErr=false;
  const step=()=>{
    const f=files.shift();
    if(!f){D.phBusy=false;D.phErr=fails.length>0;D.phMsg=fails.length?fails.join(" "):"";
      call("listPhotos",S.token,it.key).then(l=>{D.photos=l;refreshPh(D,it);}).catch(()=>refreshPh(D,it));
      if(n)toast("Фото добавлено: "+n);return;}
    D.phMsg="Загружаю "+(n+fails.length+1)+" из "+total+"…";refreshPh(D,it);
    phPrepare(f).then(x=>call("addPhoto",S.token,it.key,type,x.full,x.thumb,x.name)).then(r=>{S.ph[it.key]=r.counts;S.phDirty=true;n++;})
      .catch(e=>{if(String(e&&e.message).indexOf("SESSION_EXPIRED")>=0){files.length=0;fail(e);}fails.push((e&&e.message)||String(e));}).then(step);
  };
  step();
}

  document.body.appendChild(lb);

  phFull(id).then(url=>{if(!$("lbimg"))return;$("lbimg").innerHTML='<img alt="Фото">';$("lbimg").firstChild.src=url;const a=$("lbdl");a.href=url;a.download=(p.name||"foto")+(/\.jpe?g$/i.test(p.name||"")?"":".jpg");a.hidden=false;})
    .catch(e=>{if($("lbimg"))$("lbimg").innerHTML='<span class="imp-err" style="color:#ffb4a8">'+esc((e&&e.message)||String(e))+'</span>';});
  if(can)$("lbdel").onclick=()=>{if(!confirm("Удалить это фото?"))return;$("lbdel").disabled=true;
    call("deletePhoto",S.token,id).then(r=>{S.ph[it.key]=r.counts;S.phDirty=true;D.photos=(D.photos||[]).filter(x=>x.id!==id);delete PHC[id];close();refreshPh(D,it);toast("Фото удалено");})
      .catch(e=>{$("lbdel")&&($("lbdel").disabled=false);fail(e);});};
}

  if(sh&&V.show!=="all")t.push(sh[1].toLowerCase());
  if(V.month)t.push(mname(V.month));
  if(V.ex)t.push("исполнитель: "+V.ex);
  if(V.master)t.push("мастер: "+(V.master==="—"?"не назначен":V.master));
  if(V.uk)t.push("упр. компания: "+(V.uk==="—"?"не указана":V.uk));
  if(V.addr)t.push("адрес: "+V.addr);
  if(V.cat)t.push("вид работ: "+V.cat);
  if(V.flag&&FLAGS[V.flag])t.push(FLAGS[V.flag][0]);
  if(V.q)t.push("поиск: «"+V.q+"»");
  return t.length?t.join("; "):"без отбора";
}
const xlSerial=iso=>{const p=iso.split("-");return(Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(1899,11,30))/864e5;};

      "Просрочено, дней","Дата выполнения","Комментарий","Стадия Битрикс24","Сроки Битрикс24","Сверить","Источники статуса","Фото до","Фото после"];
    const rows=all.map((i,n)=>[n+1,MN[+i.month.slice(5)-1]+" "+i.month.slice(0,4),xlSerial(mend(i.month)),i.addr,i.uk||"",i.work,i.cat||"",i.basis||"",i.sum||"",i.fsum||"",i.ex,i.master||"",
      G_NAME[i.g],i.status,i.act||"",i.overdue||"",i.doneAt?xlSerial(isoLocal(i.doneAt)):"",i.note||"",i.bxStage||"",i.bxDates||"",i.check||"",i.src||"",phCount(i)[0]||"",phCount(i)[1]||""]);
    const ws=X.utils.aoa_to_sheet([H].concat(rows));
    rows.forEach((r,n)=>{[[2,"dd.mm.yyyy"],[8,"#,##0"],[9,"#,##0"],[16,"dd.mm.yyyy"]].forEach(([c,z])=>{const x=ws[X.utils.encode_cell({r:n+1,c})];if(x&&x.t==="n")x.z=z;});});
    ws["!cols"]=[5,14,12,26,14,46,20,28,12,12,14,20,18,20,16,11,12,40,16,26,40,50,8,8].map(w=>({wch:w}));
    ws["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:H.length-1}})};
    // лист «Сводка»: те же цифры, что на странице
    const plan=scoped().filter(i=>i.g!=="cancel"),N=plan.length,C={},OD={};
    ORDER.forEach(k=>{C[k]=plan.filter(i=>i.g===k).length;OD[k]=plan.filter(i=>i.g===k&&i.overdue).length;});
    const open=plan.filter(i=>!i.closed),actlate=plan.filter(i=>i.actlate).length,pc=n=>N?n/N:0;
    const sc=scoped(),A=[["Текущий ремонт — выгрузка из трекера"],
      ["Выгружено "+stamp+" "+pad(now.getHours())+":"+pad(now.getMinutes())+", "+S.user.name+" ("+S.user.role+"). Просрочка считается на "+dmy(TODAY)+"."],
      ["Работы: "+(mine?"только «"+myEx()+"»":"все")+". Отбор на листе «Работы»: "+desc+" ("+all.length+" "+plural(all.length,"работа","работы","работ")+")."],[],
      ["ГДЕ МЫ СЕЙЧАС"],["Стадия","Работ","% плана","Из них просрочено"]];
    ORDER.forEach(k=>A.push([G_NAME[k],C[k],pc(C[k]),k==="todo"||k==="prog"||k==="attn"?OD[k]:k==="noact"?actlate:""]));
    A.push(["Итого в плане",N,N?1:0,plan.filter(i=>i.overdue).length],["Выполнено (ждёт акта + принято)",C.noact+C.done,pc(C.noact+C.done),""],["Снято с плана (в проценты не входит)",sc.length-N,"",""],[],
      ["ГДЕ ПРОБЛЕМЫ"],["Проблема","Работ","Важность","Кто решает"]);
    const SV={high:"срывает сроки",mid:"копится",low:"порядок в данных"};
    probList(sc,plan,C,OD,open,actlate,mine).forEach(p=>A.push([p[3],p[2],SV[p[1]],p[4]]));
    A.push([],["ПО МЕСЯЦАМ ПЛАНА"],["Месяц","В плане"].concat(ORDER.map(k=>SHORT[k]),["% выполнено","Состояние"]));
    monthRows(sc).forEach(x=>A.push([x.label,x.l.length].concat(ORDER.map(k=>x.l.filter(i=>i.g===k).length),[x.d/x.l.length,x.txt])));
    Object.keys(WHO).forEach(k=>{const W=WHO[k];A.push([],["КТО ОТСТАЁТ: "+W[3].toUpperCase()],[W[0],"В плане"].concat(ORDER.map(g=>SHORT[g]),["Просрочено","% выполнено"]));
      whoRows(plan,W).forEach(r=>A.push([W[2](r.k),r.n].concat(ORDER.map(g=>r[g]),[r.od,(r.noact+r.done)/r.n])));});
    const sw=X.utils.aoa_to_sheet(A);
    A.forEach((r,n)=>r.forEach((v,c)=>{const x=sw[X.utils.encode_cell({r:n,c})];if(x&&x.t==="n"&&typeof v==="number"&&v<=1&&v>=0&&!Number.isInteger(v))x.z="0%";}));
    sw["!cols"]=[46,10,10,12,12,12,12,12,14,14].map(w=>({wch:w}));
    const wb=X.utils.book_new();X.utils.book_append_sheet(wb,sw,"Сводка");X.utils.book_append_sheet(wb,ws,"Работы");
    X.writeFile(wb,"Текущий ремонт "+stamp+".xlsx");
    toast("Выгружено: "+all.length+" "+plural(all.length,"работа","работы","работ"));
  }).catch(fail).then(()=>{if(btn)btn.disabled=false;});

const XSRC=[["plan","1. Годовой план ПТО"],["exec","2. Файл исполнителей"],["bx","3. Выгрузка Битрикс24"]];
const isoLocal=ts=>{const d=new Date(ts),p=n=>(n<10?"0":"")+n;return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());};
// библиотека чтения Excel грузится только при открытии окна; сначала с проверкой контрольной суммы, затем запасной адрес
let xlsxP=null;
function loadXlsx(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(xlsxP)return xlsxP;
  const add=(src,sri)=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;if(sri){s.integrity=sri;s.crossOrigin="anonymous";}s.onload=res;s.onerror=()=>{s.remove();rej(new Error("load"));};document.head.appendChild(s);});
  xlsxP=add("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js","sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw")
    .catch(()=>add("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"))
    .then(()=>{if(!window.XLSX)throw new Error("no lib");return window.XLSX;})
    .catch(()=>{xlsxP=null;throw new Error("Не удалось загрузить библиотеку чтения Excel. Проверьте подключение к интернету и попробуйте ещё раз.");});
  return xlsxP;
}
function impFail(D,host,er){
  D.busy=false;
  if(String((er&&er.message)||er).indexOf("SESSION_EXPIRED")>=0){fail(er);return;}
  D.err=(er&&er.message)||String(er);if(V.drawer===D)renderImport(host);
}
function impInfo(r){
  const i=r.info,pl=(n,a,b,c)=>n+" "+plural(n,a,b,c);
  return'<div class="box"><h4>Что прочитано из файлов</h4><ul class="imp-info"><li>Годовой план (лист «'+esc(i.planSheet)+'»): '+pl(i.planRows,"работа","работы","работ")+'</li>'+
    '<li>Файл исполнителей: '+pl(i.execRows,"работа","работы","работ")+', из пополнений '+i.execAdds+', по листам мастеров '+i.execMasters+'</li>'+
    '<li>Битрикс24: '+pl(i.bitrixRows-i.bitrixJunk,"карточка","карточки","карточек")+(i.bitrixJunk?' (тестовых и пустых пропущено '+i.bitrixJunk+')':"")+'</li>'+
    '<li>Сведено работ: <b>'+r.items.length+'</b></li></ul>'+(r.warnings.length?r.warnings.map(w=>'<div class="imp-err" role="alert">'+esc(w)+'</div>').join(""):"")+'</div>';
}
function runExcel(host){
  const D=V.drawer;D.busy=true;D.err="";D.rep=null;D.info=null;D.text="";
  $("xgo").disabled=true;$("impmsg").textContent="Читаю файлы…";
  Promise.all([loadXlsx(),D.files.plan.arrayBuffer(),D.files.exec.arrayBuffer(),D.files.bx.arrayBuffer()])
    .then(a=>new Promise(res=>setTimeout(()=>res(a),30)))   // дать странице отрисовать «Читаю файлы…»
    .then(a=>{
      TrackerMerge.setLib(a[0]);
      const res=TrackerMerge.merge({plan:a[1],exec:a[2],bx:a[3],dates:D.dates,today:isoLocal(Date.now()),
        canon:S.items.map(i=>i.addr),prev:S.items.map(i=>({addr:i.addr,work:i.work,month:i.month,cat:i.cat}))});
      D.info=res;D.text=JSON.stringify({format:"tracker-import-1",generated:res.generated,sources:res.sources,items:res.items});
      return call("importWorks",S.token,D.text,false);})
    .then(rep=>{D.rep=rep;D.busy=false;if(V.drawer===D){renderImport(host);const b=host.querySelector(".imp-info");if(b)b.closest(".box").scrollIntoView({block:"start"});}})
    .catch(er=>impFail(D,host,er));
}
function renderImport(host){
  const D=V.drawer,r=D.rep;D.mode=D.mode||"xls";D.files=D.files||{};D.dates=D.dates||{};D.touched=D.touched||{};
  const seg='<div class="seg" role="group" aria-label="Откуда данные"><button type="button" data-imode="xls" aria-pressed="'+(D.mode==="xls")+'">Из файлов Excel</button>'+
    '<button type="button" data-imode="json" aria-pressed="'+(D.mode==="json")+'">Готовый файл .json</button></div>';
  const src=D.mode==="xls"?
    '<p class="muted" style="margin:0;font-size:13px">Выберите три свежие выгрузки. Файлы никуда не отправляются: сведение идёт в вашем браузере, на сервер уходит только итог.</p>'+
    XSRC.map(x=>'<div class="xrow"><label class="field">'+x[1]+'<input type="file" id="xf-'+x[0]+'" accept=".xls,.xlsx"></label>'+
      '<label class="field">Данные на дату<input type="date" id="xd-'+x[0]+'" value="'+esc(D.dates[x[0]]||"")+'"></label></div>'+
      '<div class="faint xn" id="xn-'+x[0]+'">'+esc(D.files[x[0]]?D.files[x[0]].name:"")+'</div>').join("")+
    '<div class="faint" style="font-size:12px">Дата нужна, чтобы при расхождении победила более свежая выгрузка.</div>'+
    '<button class="btn" id="xgo" type="button" disabled>Свести и показать, что изменится</button>'
  :
    '<p class="muted" style="margin:0;font-size:13px">Выберите файл «Обновление для трекера … .json», собранный командой build.py.</p>'+
    '<label class="field">Файл обновления<input id="impf" type="file" accept=".json,application/json"></label>'+(D.name?'<div class="faint" style="font-size:12px">'+esc(D.name)+(D.busy&&!r?" — проверяю…":"")+'</div>':"");
  host.innerHTML='<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="Загрузка обновления"><div class="dh"><h3>Загрузить обновление</h3><button class="x" id="dx" type="button" aria-label="Закрыть">×</button></div>'+
  '<div class="db">'+seg+src+(D.err?'<div class="imp-err" role="alert">'+esc(D.err)+'</div>':"")+(D.info?impInfo(D.info):"")+(r?impPreview(r):"")+
  '<p class="muted" style="margin:0;font-size:12px">Отметки сотрудников не стираются: если источники опережают их отметку, работа получит метку «сверить». Работы, которых нет в файлах, не удаляются.</p></div>'+
  '<div class="df"><button class="btn primary" id="impgo" type="button"'+(r&&(r.added||r.updated||r.flagged)&&!D.busy?"":" disabled")+'>Применить</button><button class="btn" id="impx" type="button">Закрыть</button><span class="msg" id="impmsg"></span></div></aside>';
  $("dx").onclick=closeDrawer;$("scrim").onclick=closeDrawer;$("impx").onclick=closeDrawer;
  document.querySelectorAll("[data-imode]").forEach(b=>b.onclick=()=>{if(D.busy||D.mode===b.dataset.imode)return;D.mode=b.dataset.imode;D.rep=null;D.info=null;D.err="";D.text="";renderImport(host);});
  if(D.mode==="xls"){
    loadXlsx().catch(()=>{});   // подгружаем заранее
    const ready=()=>{$("xgo").disabled=D.busy||!(D.files.plan&&D.files.exec&&D.files.bx&&D.dates.plan&&D.dates.exec&&D.dates.bx);};
    XSRC.forEach(x=>{const k=x[0];
      $("xf-"+k).onchange=e=>{const f=e.target.files[0];if(!f)return;D.files[k]=f;D.rep=null;D.info=null;$("xn-"+k).textContent=f.name;
        if(!D.touched[k]){D.dates[k]=isoLocal(f.lastModified);$("xd-"+k).value=D.dates[k];}
        if(k==="exec")   // дата в названии листа «Тек.Рем (08.10.2026)» точнее даты файла
          Promise.all([loadXlsx(),f.arrayBuffer()]).then(a=>{const wb=a[0].read(a[1],{type:"array",bookSheets:true}),n=wb.SheetNames.find(s=>/^тек\.?\s*рем/i.test(s)),d=n&&TrackerMerge.dateOfName(n);
            if(d&&!D.touched.exec&&V.drawer===D){D.dates.exec=d;if($("xd-exec"))$("xd-exec").value=d;ready();}}).catch(()=>{});
        ready();};
      $("xd-"+k).onchange=e=>{D.dates[k]=e.target.value;D.touched[k]=true;ready();};});
    ready();$("xgo").onclick=()=>runExcel(host);
  }else if($("impf")){
    $("impf").onchange=e=>{const f=e.target.files[0];if(!f)return;
      if(f.size>5e6){D.err="Файл больше 5 МБ. Это не файл обновления.";D.rep=null;D.name=f.name;renderImport(host);return;}
      const rd=new FileReader();
      rd.onload=()=>{D.text=String(rd.result);D.name=f.name;D.rep=null;D.err="";D.busy=true;renderImport(host);
        call("importWorks",S.token,D.text,false).then(rep=>{D.rep=rep;D.busy=false;if(V.drawer===D)renderImport(host);}).catch(er=>impFail(D,host,er));};
      rd.onerror=()=>impFail(D,host,new Error("Не удалось прочитать файл."));
      rd.readAsText(f,"utf-8");};
  }
  $("impgo").onclick=()=>{D.busy=true;$("impgo").disabled=true;$("impmsg").textContent="Записываю…";
    call("importWorks",S.token,D.text,true).then(rep=>{toast("Обновление применено: добавлено "+rep.added+", обновлено "+rep.updated+(rep.flagged?", на сверку "+rep.flagged:""));closeDrawer();load(true);}).catch(er=>impFail(D,host,er));};
}

function renderIssues(){

  $("view").innerHTML='<div class="head"><h2>Открытые вопросы</h2><span class="muted">'+open+' из '+S.issues.length+' открыто</span></div>'+
  (isAdmin()?'<form class="card" id="qf" style="display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:12px">'+
    '<label class="field">Новый вопрос<input id="qt" maxlength="1000" placeholder="Что нужно решить"></label><label class="field">Ответственный<input id="qr" maxlength="80"></label>'+
    '<label class="field">Срок<input id="qd" maxlength="40" placeholder="до 15.10"></label><button class="btn primary" type="submit">Добавить</button></form>':"")+
  '<div class="list"><ul class="ilist">'+
  S.issues.slice().sort((a,b)=>a.done-b.done).map(i=>'<li class="'+(i.done?"done":"")+'"><input type="checkbox" data-iss="'+i.num+'"'+(i.done?" checked":"")+(isAdmin()?"":" disabled")+' aria-label="Вопрос решён">'+
   '<div><div class="t">'+esc(i.text)+'</div><div class="meta"><span>'+esc(i.resp)+'</span><span>срок: '+esc(i.term)+'</span>'+(i.done&&i.by?'<span>закрыл '+esc(i.by)+' '+when(i.at)+'</span>':"")+'</div></div></li>').join("")+'</ul></div>';
  if($("qf"))$("qf").onsubmit=e=>{e.preventDefault();const t=$("qt").value.trim();if(!t){toast("Опишите вопрос");return;}
    call("addIssue",S.token,{text:t,resp:$("qr").value,term:$("qd").value}).then(is=>{S.issues=is;toast("Вопрос добавлен");renderIssues();}).catch(fail);};
  document.querySelectorAll("[data-iss]").forEach(c=>c.onchange=()=>{c.disabled=true;call("setIssue",S.token,+c.dataset.iss,c.checked).then(()=>load(true)).catch(e=>{c.checked=!c.checked;c.disabled=false;fail(e);});});
}
function renderLog(){
  $("view").innerHTML='<div class="head"><h2>Журнал изменений</h2><span class="muted">последние '+S.log.length+'</span></div><div class="list">'+
  (S.log.length?'<ul class="ilist loglist">'+S.log.map(l=>'<li><div><div class="t"><b>'+esc(l.addr||"Вопрос")+'</b> · '+esc(l.work.slice(0,90))+'</div><div class="meta"><span>'+when(l.at)+'</span><span>'+esc(l.by)+'</span><span>'+esc(l.what)+(l.from?': '+esc((l.what==="Перенос срока"?mname(l.from):l.from).slice(0,60))+' →':":")+' <b>'+esc((l.what==="Перенос срока"?mname(l.to):l.to).slice(0,80))+'</b></span></div></div></li>').join("")+'</ul>':'<div class="empty">Изменений пока нет.</div>')+'</div>';

function renderUsers(){

    us.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.role)+'</td><td class="muted">'+[u.bxId?"Битрикс24 · "+esc(u.bxId):"",u.hasPin?"PIN":""].filter(Boolean).join(" · ")+'</td><td>'+(u.active?"активен":'<span class="faint">отключён</span>')+'</td><td><button class="linkbtn" data-u="'+esc(u.name)+'" data-r="'+esc(u.role)+'" data-a="'+u.active+'" data-b="'+esc(u.bxId||"")+'" type="button">Изменить</button></td></tr>').join("")+'</tbody></table>';
    document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{$("uo").value=b.dataset.u;$("un").value=b.dataset.u;$("ur").value=b.dataset.r;$("ua").checked=b.dataset.a==="true";$("ub").value=b.dataset.b;$("up").value="";$("un").focus();});};
  call("listUsers",S.token).then(draw).catch(fail);
  $("uf").onsubmit=e=>{e.preventDefault();call("saveUser",S.token,{oldName:$("uo").value,name:$("un").value.trim(),role:$("ur").value,active:$("ua").checked,pin:$("up").value.trim(),bxId:$("ub").value.trim()})
    .then(us=>{draw(us);toast("Сохранено");$("uf").reset();$("uo").value="";}).catch(fail);};
}
