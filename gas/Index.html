<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер текущего ремонта</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: шапка с вкладками; «Сводка» сверху вниз отвечает на вопросы: где мы (стадии) → где проблемы → когда (месяцы) → кто отстаёт → где (адреса, виды работ); «Работы» — список с быстрыми фильтрами по стадиям, детали в боковой панели */
:root{
  --bg:#f3f4f2; --surface:#fff; --surface-2:#eceeea; --line:#dde1da; --line-strong:#bcc2b8;
  --fg:#1d2420; --muted:#5b665f; --faint:#8a948d;
  --accent:#1f5f8b; --accent-ink:#fff; --accent-soft:#dde9f2;
  /* стадии: метка на графике · текст · подложка. Палитра проверена на различимость соседних стадий, в том числе при дальтонизме */
  --todo:#8b939b; --todo-ink:#4f5860; --todo-bg:#eceef0;
  --prog:#1859a6; --prog-ink:#164f93; --prog-bg:#e1ebf7;
  --noact:#d29b00; --noact-ink:#7f5b00; --noact-bg:#faf0d2;
  --done:#2e7d3a; --done-ink:#256b30; --done-bg:#e0f1e2;
  --winter:#8a5cc2; --winter-ink:#6d45a6; --winter-bg:#efe8f8;
  --attn:#c0392b; --attn-ink:#a8321f; --attn-bg:#fbe5e1;
  --cancel:#a3a8a4; --cancel-ink:#6b716d; --cancel-bg:#eceeec;
  --ex-pto:#4f5f6b; --ex-own:#a9530b; --ex-none:#8a948d;
  --banner:#fbefd6;
  --shadow:0 10px 40px rgba(20,30,25,.18);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --surface:#1c2320; --surface-2:#252d29; --line:#2f3833; --line-strong:#47524b;
  --fg:#e5ebe7; --muted:#a3ada7; --faint:#77827b; --accent:#6fb0de; --accent-ink:#0d1b25; --accent-soft:#1d3342;
  --todo:#5d6772; --todo-ink:#b4bcc4; --todo-bg:#2a3036; --prog:#4893e3; --prog-ink:#8ec0f5; --prog-bg:#1b2f47;
  --noact:#cfa22e; --noact-ink:#f0cc6a; --noact-bg:#3a2f12; --done:#2a8040; --done-ink:#7fd08c; --done-bg:#1b3520;
  --winter:#8f74d8; --winter-ink:#c4b2f2; --winter-bg:#2c2540; --attn:#d95a49; --attn-ink:#ff9b8c; --attn-bg:#3d1f1b;
  --cancel:#6f7672; --cancel-ink:#a4aba7; --cancel-bg:#2a302c; --ex-pto:#a9b8c3; --ex-own:#f3a35e; --ex-none:#77827b;
  --banner:#3a2d12; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
[hidden]{display:none!important}

/* shell */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs button{border:0;background:none;padding:18px 12px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.who{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:13px}
.role{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
@media (max-width:720px){.brand{display:none}.who .nm,.who .role{display:none}.bar-in{gap:8px}.tabs button{padding:18px 9px 16px}}

.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.ctl{padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.2}
.err{color:var(--attn-ink);font-size:13px;min-height:18px}
.hint{font-size:12px;color:var(--faint)}

/* цвета стадий и исполнителей: --c метка, --ci текст, --cb подложка */
.g-todo{--c:var(--todo);--ci:var(--todo-ink);--cb:var(--todo-bg)} .g-prog{--c:var(--prog);--ci:var(--prog-ink);--cb:var(--prog-bg)}
.g-noact{--c:var(--noact);--ci:var(--noact-ink);--cb:var(--noact-bg)} .g-done{--c:var(--done);--ci:var(--done-ink);--cb:var(--done-bg)}
.g-winter{--c:var(--winter);--ci:var(--winter-ink);--cb:var(--winter-bg)} .g-attn{--c:var(--attn);--ci:var(--attn-ink);--cb:var(--attn-bg)}
.g-cancel{--c:var(--cancel);--ci:var(--cancel-ink);--cb:var(--cancel-bg)}
.e-pto{--ci:var(--ex-pto)} .e-own{--ci:var(--ex-own)} .e-none{--ci:var(--ex-none)}
.fill{background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ci);background:var(--cb)}
.pill.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;font-weight:600;color:var(--ci)}
.chkpill{font-size:10px;font-weight:600;border:1px dashed var(--line-strong);color:var(--muted);border-radius:999px;padding:0 7px;white-space:nowrap}
.bad{color:var(--attn-ink);font-weight:600}

/* сводка */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:16px}
.head h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card+.card,.grid2+.card,.card+.grid2,.grid2+.grid2{margin-top:12px}
.card h3{margin:0;font-size:15px;font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.card h3 span{font-weight:400;color:var(--muted);font-size:12px}
.card .sub{font-size:12px;color:var(--muted);margin:2px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2>.card{margin-top:0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px;margin:10px 0 14px}
.hero-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-big{font-family:var(--f-display);font-size:34px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.hero-txt{font-size:14px;max-width:60ch}
.money{font-size:12px;color:var(--muted)}
.pipe{display:flex;gap:2px;height:28px}
.pipe span{min-width:4px;background:var(--c)}
.pipe span:first-child{border-radius:6px 0 0 6px} .pipe span:last-child{border-radius:0 6px 6px 0}
.pipe .gap{flex:0 0 8px;background:transparent;min-width:0}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) repeat(2,minmax(0,.85fr));column-gap:22px;row-gap:10px;margin-top:12px}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.stage:hover{border-color:var(--c)}
.stage.side{border-style:dashed}
.stage.arrow::after{content:"→";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px}
.stage .sh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ci)}
.stage .sh i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.stage .sn{font-family:var(--f-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stage .sp{font-size:12px;color:var(--muted)}
.stage .sx{font-size:12px;font-weight:600;color:var(--attn-ink);min-height:18px}
.stage .sx.ok{color:var(--muted);font-weight:400}
@media (max-width:900px){.stages{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px}.stage.arrow::after{display:none}}
.note{font-size:12px;color:var(--faint);margin:10px 0 0}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:4px 56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 0;border-top:1px solid var(--line);cursor:pointer}
.plist li:first-child{border-top:0}
.plist li:hover{background:var(--surface-2)}
.plist .sv{align-self:stretch;border-radius:2px;background:var(--c)}
.plist .pn{font-family:var(--f-display);font-size:20px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.plist .pt{min-width:0} .plist .pt b{display:block;font-size:13px;font-weight:600} .plist .pt span{font-size:12px;color:var(--muted)}
.plist .pa{font-size:12px;color:var(--accent);white-space:nowrap}
.sev-high{--c:var(--attn)} .sev-mid{--c:var(--noact)} .sev-low{--c:var(--todo)}
@media (max-width:560px){.plist .pa{display:none}.plist li{grid-template-columns:4px 44px minmax(0,1fr);gap:10px}}
.mrow{display:grid;grid-template-columns:168px minmax(0,1fr) 104px;gap:10px;align-items:center;padding:6px 4px;cursor:pointer;border-radius:6px}
.mrow:hover{background:var(--surface-2)}
.mrow .ml{font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.mb{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;font-style:normal}
.mb.late{color:var(--attn-ink);background:var(--attn-bg)} .mb.now{color:var(--prog-ink);background:var(--prog-bg)}
.mb.ok{color:var(--done-ink);background:var(--done-bg)} .mb.next{color:var(--muted);background:var(--surface-2)} .mb.wait{color:var(--noact-ink);background:var(--noact-bg)}
.mrow .mv{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.mrow{grid-template-columns:120px minmax(0,1fr) 72px}.mrow .mv span{display:none}}
.stack{display:flex;gap:2px;height:14px}
.stack span{height:100%;min-width:3px;background:var(--c)}
.stack span:first-child{border-radius:4px 0 0 4px} .stack span:last-child{border-radius:0 4px 4px 0} .stack span:only-child{border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.tscroll{overflow-x:auto;margin:0 -4px}
.wt{width:100%;border-collapse:collapse;font-size:13px;min-width:780px}
.wt th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.wt th i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:4px}
.wt th:first-child,.wt td:first-child{text-align:left}
.wt td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wt tbody tr{cursor:pointer} .wt tbody tr:hover{background:var(--surface-2)}
.wt .z{color:var(--faint)}
@media (max-width:640px){.wt{min-width:0}.wt .st{display:none}.wt th,.wt td{padding:8px 5px}.wt th,.wt td:first-child{white-space:normal}.wt .pbar{gap:6px}.wt .pbar i{width:30px}}
.pbar{display:inline-flex;align-items:center;gap:8px} .pbar i{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i b{display:block;height:100%;background:var(--done)}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 34px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.hbar .lbl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar:hover .lbl{color:var(--accent)}
.hbar .tr{height:10px}
.hbar .tr i{display:block;height:100%;background:var(--attn);border-radius:0 4px 4px 0;min-width:3px}
.hbar .val{font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.alist li:first-child{border-top:0}
.alist li:hover .a{color:var(--accent)}
.alist .a{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist .m{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.hbar{grid-template-columns:minmax(0,120px) minmax(0,1fr) 30px}.alist li{flex-direction:column;align-items:flex-start;gap:4px}.alist .a{max-width:100%}}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap}

.hrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px}

/* работы */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters .ctl{width:auto;flex:0 1 auto}
.filters .search{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--fg)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)} .chip[aria-pressed="true"] b{color:var(--bg)}
.fpills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.fpill{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:3px 4px 3px 10px}
.fpill button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 5px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;user-select:none}
.count{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wr{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 0;border-top:1px solid var(--line);cursor:pointer}
.wr:first-child{border-top:0}
.wr:hover{background:var(--surface-2)}
.wr .sev{align-self:stretch;background:var(--c)}
.wr .a{font-weight:600;font-size:13px}
.wr .w{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wr .od{font-size:11px;color:var(--attn-ink);font-weight:600}
.wr .al{font-size:11px;color:var(--noact-ink);font-weight:600}
.lock{font-size:11px;color:var(--faint)}
.more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);cursor:pointer;font-weight:500}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* панель работы */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:16px;line-height:1.3}
.dh .x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.db{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.steps{display:flex;list-style:none;margin:0;padding:0;gap:4px}
.steps li{flex:1;font-size:11px;color:var(--faint);text-align:center;position:relative;padding-top:12px}
.steps li::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:3px;background:var(--surface-2)}
.steps li.past::before,.steps li.cur::before{background:var(--c)}
.steps li.cur{color:var(--fg);font-weight:600}
.stop{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--cb);color:var(--ci)}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;word-break:break-word}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.box.chkbox{border-style:dashed;border-color:var(--line-strong);background:var(--surface-2)}
.box h4{margin:0;font-size:13px}
.hist{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.df .msg{font-size:12px;color:var(--muted);margin-left:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.imp-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.imp-row:first-of-type{border-top:0}
.imp-row small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.imp-row b{font-family:var(--f-display);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.imp-row.zero,.imp-row.zero small{color:var(--faint)}
.imp-det{font-size:12px;color:var(--muted)} .imp-det summary{cursor:pointer;color:var(--accent);padding:2px 0}
.imp-det ul{margin:6px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.imp-err{color:var(--attn-ink);font-size:13px}

/* вопросы, журнал, пользователи */
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.ilist li:first-child{border-top:0}
.ilist .t{font-size:13px}
.ilist .done .t{color:var(--faint);text-decoration:line-through}
.ilist .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.loglist li{grid-template-columns:minmax(0,1fr)}
.utable{width:100%;border-collapse:collapse;font-size:13px}

<body>
<div id="root"></div>
<div class="tip" id="tip" hidden></div>
<script>window.BOOT=<?!= BOOT ?>;</script>
<script>
(function(){
"use strict";
/* ---------- справочники ---------- */
// стадии работы по ходу: не начато → в работе → выполнено, ждёт акта → принято с актом; вне хода: на зиму, нужно решение, снято
const GROUPS=[
  ["todo","Не начато",["Не начато","Передано исполнителю"]],
  ["prog","В работе",["В работе","На контроле","Материал заказан"]],
  ["noact","Выполнено, ждёт акта",["Выполнено, акта нет"]],
  ["done","Принято с актом",["Принято, акт есть"]],
  ["winter","Отложено на зиму",["Отложено на зиму"]],
  ["attn","Нужно решение",["Нужно решение","Требует уточнения","Нет статуса","Вопрос капремонта","Голосование ОСС"]],
  ["cancel","Снято с плана",["Снято"]]];
const ORDER=["todo","prog","noact","done","winter","attn"];
const SHORT={todo:"Не начато",prog:"В работе",noact:"Ждёт акта",done:"Принято",winter:"На зиму",attn:"Нужно решение",cancel:"Снято"};
const G_OF={}; GROUPS.forEach(g=>g[2].forEach(s=>G_OF[s]=g[0]));
const G_NAME={}; GROUPS.forEach(g=>G_NAME[g[0]]=g[1]);
const ADMIN_ONLY=["Принято, акт есть","Снято"];
const EXS=["УК","Подрядчики","Не распределено"];
const EX_CLS={"Подрядчики":"e-pto","УК":"e-own","Не распределено":"e-none"};
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MNG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const mfrom=m=>{const p=String(m||"").split("-");return p.length===2?MNG[+p[1]-1]:m||"";};
const mname=m=>{const p=String(m||"").split("-");return p.length===2?MN[+p[1]-1]+(p[0]!==String(new Date().getFullYear())?" "+p[0]:""):m||"—";};
const mend=m=>{const p=m.split("-");if(p.length!==2)return"";const d=new Date(+p[0],+p[1],0);return p[0]+"-"+p[1]+"-"+String(d.getDate()).padStart(2,"0");};
const mshift=(m,k)=>{const p=m.split("-");const d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
let MONTHS=[];
function buildMonths(){const set=new Set(S.items.map(i=>i.month).filter(Boolean));const cur=TODAY.slice(0,7);for(let k=-1;k<=3;k++)set.add(mshift(cur,k));
  MONTHS=[...set].sort().map(m=>[m,mname(m)]);}
const ROLES=["Администратор","УК","Подрядчики","Просмотр"];
const pad=n=>String(n).padStart(2,"0");
const TODAY=(d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()))(new Date());

const esc=s=>s==null?"":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n?Math.round(n).toLocaleString("ru-RU")+" ₽":"—";
const mshort=n=>n>=1e6?(n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн ₽":n>=1e3?Math.round(n/1e3)+" тыс ₽":money(n);
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c;};
const days=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const when=ms=>{if(!ms)return"";const d=new Date(ms);return pad(d.getDate())+"."+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes());};
const $=id=>document.getElementById(id);

/* ---------- сервер: Apps Script или демо ---------- */
const REAL=typeof google!=="undefined"&&google.script&&google.script.run;
const BOOT=window.BOOT||null, IN_BX=!!(BOOT&&BOOT.bitrix);
function call(fn,...args){
  if(REAL)return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e&&e.message?e:new Error(String(e))))[fn](...args));
  return new Promise((res,rej)=>setTimeout(()=>{try{res(JSON.parse(JSON.stringify(DEMO[fn](...args))));}catch(e){rej(e);}},120));
}
const DEMO=(function(){
  const seed=window.DEMO_SEED; if(!seed)return {};
  const users=[{name:"Администратор",role:"Администратор",active:true},{name:"Филимонов",role:"УК",active:true},{name:"ПТО (подрядчики)",role:"Подрядчики",active:true},{name:"Руководитель",role:"Просмотр",active:true}];
  const items=seed.items.map(x=>Object.assign({note:"",at:null,by:"",act:"",doneAt:null,month0:x.month},x));
  const issues=seed.issues.map((x,i)=>({num:i+1,text:x.text,resp:x.resp,term:x.term,ref:x.ref||"",done:false}));
  const log=[]; let rev=1; const sess={};
  const auth=t=>{const u=sess[t];if(!u)throw new Error("SESSION_EXPIRED");return u;};
  const can=(u,it)=>u.role==="Администратор"||(u.role==="УК"&&it.ex==="УК")||(u.role==="Подрядчики"&&it.ex==="Подрядчики");
  const L=(u,it,what,from,to)=>log.unshift({at:Date.now(),by:u.name,key:it.key,addr:it.addr,work:it.work,what,from:String(from==null?"":from),to:String(to==null?"":to)});
  return{
    getLoginNames:()=>users.filter(u=>u.active).map(u=>u.name),
    login(name,pin){const u=users.find(x=>x.name===name&&x.active);if(!u||pin!=="1111")throw new Error("Неверное имя или PIN.");const t="t"+Math.random();sess[t]={name:u.name,role:u.role};return{token:t,user:sess[t]};},
    logout(t){delete sess[t];return true;},
    bootstrap(t){return{user:auth(t),rev,asof:seed.generated,items,issues,log:log.slice(0,60)};},
    getRev(t){auth(t);return rev;},
    updateWork(t,key,p){const u=auth(t),it=items.find(x=>x.key===key),adm=u.role==="Администратор";if(!can(u,it))throw new Error("У вас нет прав менять эту работу.");
      const now=Date.now(),DONE=["Выполнено, акта нет","Принято, акт есть"];
      if(["ex","month","fsum","act","master","check"].some(k=>p[k]!=null)&&!adm)throw new Error("Исполнителя, месяц, факт и акт меняет только администратор.");
      if(p.status!=null&&p.status!==it.status){if(!adm&&(ADMIN_ONLY.includes(p.status)||ADMIN_ONLY.includes(it.status)))throw new Error("Принимает работу и снимает её с плана только администратор.");
        L(u,it,"Статус",it.status,p.status);if(DONE.includes(p.status)&&!DONE.includes(it.status))it.doneAt=now;if(!DONE.includes(p.status))it.doneAt=null;it.status=p.status;}
      if(p.note!=null&&p.note.trim()!==it.note){L(u,it,"Комментарий",it.note,p.note.trim());it.note=p.note.trim();}
      if(p.ex!=null&&p.ex!==it.ex){L(u,it,"Исполнитель",it.ex,p.ex);it.ex=p.ex;}
      if(p.month!=null&&p.month!==it.month){L(u,it,"Перенос срока",it.month,p.month);it.month0=it.month0||it.month;it.month=p.month;}
      if(p.fsum!=null&&String(p.fsum)!==String(it.fsum||"")){L(u,it,"Факт, ₽",it.fsum,p.fsum);it.fsum=p.fsum===""?null:Number(p.fsum);}
      if(p.act!=null&&p.act.trim()!==(it.act||"")){L(u,it,"Акт",it.act,p.act.trim());it.act=p.act.trim();}
      if(p.master!=null&&p.master.trim()!==(it.master||"")){L(u,it,"Мастер участка",it.master,p.master.trim());it.master=p.master.trim();}
      if(p.check!=null&&p.check!==(it.check||"")){L(u,it,"Сверка",it.check,p.check||"сверено");it.check=p.check;}
      it.at=now;it.by=u.name;rev++;return it;},
    getHistory(t,key){auth(t);return log.filter(l=>l.key===key);},
    addWork(t,w){const u=auth(t);if(u.role!=="Администратор")throw new Error("Только администратор.");if(!w.addr||!w.work)throw new Error("Укажите адрес и вид работы.");
      const it={key:"n"+Date.now(),row:null,month:w.month,addr:w.addr,uk:w.uk||"",work:w.work,cat:"Добавлено вручную",basis:w.basis||"",sum:Number(w.sum)||null,fsum:null,ex:w.ex,status:"Не начато",note:"",src:"",kr:"",at:Date.now(),by:u.name};
      items.push(it);log.unshift({at:it.at,by:u.name,key:it.key,addr:it.addr,work:it.work,what:"Добавлена работа",from:"",to:it.ex});rev++;return it;},
    addIssue(t,q){const u=auth(t);if(u.role!=="Администратор")throw new Error("Только администратор.");issues.push({num:issues.length+1,text:q.text,resp:q.resp||"",term:q.term||"",ref:"",done:false});rev++;return issues;},
    setIssue(t,num,done){const u=auth(t);if(u.role!=="Администратор")throw new Error("Только администратор.");const i=issues.find(x=>x.num===num);i.done=done;i.by=u.name;i.at=Date.now();rev++;return true;},
    listUsers(t){auth(t);return users.map(u=>Object.assign({hasPin:true,bxId:""},u));},
    saveUser(t,u){auth(t);const ex=users.find(x=>x.name===(u.oldName||u.name));if(ex)Object.assign(ex,{name:u.name,role:u.role,active:u.active,bxId:u.bxId||""});else users.push({name:u.name,role:u.role,active:u.active,bxId:u.bxId||""});return this.listUsers(t);}
  };
})();

/* ---------- состояние ---------- */
let S={token:null,user:null,items:[],issues:[],log:[],rev:0,asof:""};
let V={tab:"dash",scope:"mine",q:"",month:"",ex:"",show:"open",flag:"",addr:"",cat:"",master:"",uk:"",limit:40,drawer:null,who:"ex"};
const RESET={q:"",month:"",ex:"",show:"open",flag:"",addr:"",cat:"",master:"",uk:"",limit:40};
const isDone=i=>i.g==="done"||i.g==="noact";
// быстрые отборы в списке работ
const SHOWS=[["open","Открытые"],["od","Просроченные"],["attn","Нужно решение"],["todo","Не начато"],["prog","В работе"],["noact","Ждёт акта"],["done","Принято"],["winter","На зиму"],["cancel","Снято"],["all","Все"]];
const showOK=(i,s)=>s==="all"||(s==="open"?!i.closed:s==="od"?i.overdue>0:i.g===s);
const FLAGS={
  od:["только просроченные",i=>i.overdue>0],
  actlate:["акт задерживается с прошлых месяцев",i=>i.actlate],
  chk:["требуют сверки источников",i=>!!i.check],
  bxstale:["выполнено, а в Битрикс24 «Запланировано»",i=>isDone(i)&&i.bxStage==="Запланировано"],
  nobx:["нет карточки в Битрикс24",i=>!i.bxStage&&!i.bxDates]};
// разрезы таблицы «Кто отстаёт»: заголовок, значение, как показать, подпись вкладки
const WHO={
  ex:["Исполнитель",i=>i.ex,k=>k,"Исполнители"],
  master:["Мастер участка",i=>i.master||"—",k=>k==="—"?"Мастер не назначен":k,"Мастера"],
  uk:["Управляющая компания",i=>i.uk||"—",k=>k==="—"?"Не указана":k,"Упр. компании"]};
const PROB_GO={todo_od:{show:"todo",flag:"od"},prog_od:{show:"prog",flag:"od"},attn:{show:"attn"},actlate:{show:"noact",flag:"actlate"},
  nomaster:{show:"open",master:"—"},noex:{show:"open",ex:"Не распределено"},chk:{show:"all",flag:"chk"},bxstale:{show:"all",flag:"bxstale"}};
try{const s=JSON.parse(sessionStorage.getItem("trk")||"null");if(s){S.token=s.token;S.user=s.user;}}catch(e){}
const saveSess=()=>{try{sessionStorage.setItem("trk",JSON.stringify({token:S.token,user:S.user}));}catch(e){}};

const isAdmin=()=>S.user&&S.user.role==="Администратор";
const myEx=()=>S.user&&(S.user.role==="УК"||S.user.role==="Подрядчики")?S.user.role:null;
const canEdit=it=>!!S.user&&(isAdmin()||it.ex===myEx());
function enrich(it){const g=G_OF[it.status]||"attn";const closed=g==="done"||g==="noact"||g==="cancel"||g==="winter";const e=mend(it.month||"");
  return Object.assign(it,{g,closed,moved:it.month0&&it.month0!==it.month,overdue:!closed&&e&&e<TODAY?days(e,TODAY):0,actlate:g==="noact"&&!!e&&e<TODAY});}

function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}
function fail(e){const m=(e&&e.message)||String(e);if(m.indexOf("SESSION_EXPIRED")>=0){S.token=null;saveSess();toast("Сессия закончилась — войдите снова");renderLogin();return;}toast(m);}

/* ---------- вход ---------- */
function renderLogin(){
  if(!REAL)return renderDemoPick();
  $("root").innerHTML=(REAL?"":'<div class="demo">Демо-режим: данные из файла, изменения не сохраняются. PIN для всех — 1111.</div>')+
  '<div class="login"><form class="login-card" id="lf"><div><div class="faint" style="font-size:12px">Текущий ремонт · 2026</div><h1>Трекер текущего ремонта</h1></div>'+
  '<label class="field">Кто вы<select id="ln"><option value="">Загрузка…</option></select></label>'+
  '<label class="field">PIN-код<input id="lp" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8"></label>'+
  '<div class="err" id="le"></div><button class="btn primary" id="lb" type="submit">Войти</button>'+
  '<div class="hint">PIN выдаёт администратор трекера.</div></form></div>';
  if(BOOT&&BOOT.error)$("le").textContent=BOOT.error;
  call("getLoginNames").then(ns=>{$("ln").innerHTML='<option value="">Выберите имя</option>'+ns.map(n=>'<option>'+esc(n)+'</option>').join("");}).catch(e=>{$("le").textContent=e.message;});
  $("lf").addEventListener("submit",ev=>{ev.preventDefault();const n=$("ln").value,p=$("lp").value;
    if(!n||!p){$("le").textContent="Выберите имя и введите PIN.";return;}
    $("lb").disabled=true;$("le").textContent="";
    call("login",n,p).then(r=>{S.token=r.token;S.user=r.user;saveSess();V.scope=myEx()?"mine":"all";load();}).catch(e=>{$("le").textContent=e.message;$("lb").disabled=false;});});
}

/* демо для показа: вместо PIN — выбор, от чьего имени смотреть */
function renderDemoPick(){
  const who=[["Администратор","Администратор","Всё: приёмка с актом, перенос сроков, мастер, сверка, пользователи"],
    ["Филимонов","УК","Отмечает статус и комментарий только в работах УК"],
    ["ПТО (подрядчики)","Подрядчики","Отмечает статус и комментарий только в работах подрядчиков"],
    ["Руководитель","Просмотр","Смотрит сводку и работы, ничего не меняет"]];
  $("root").innerHTML='<div class="demo">Демонстрация: данные сведены 20.10.2026 из годового плана, файла исполнителей и Битрикс24. Изменения не сохраняются.</div>'+
  '<div class="login"><div class="login-card" style="max-width:440px"><div><div class="faint" style="font-size:12px">Текущий ремонт · 2026</div><h1>Трекер текущего ремонта</h1></div>'+
  '<div class="muted" style="font-size:13px">Посмотреть трекер глазами:</div>'+
  who.map(w=>'<button class="btn" type="button" data-demo="'+esc(w[0])+'" style="text-align:left;display:flex;flex-direction:column;gap:2px"><b>'+esc(w[1])+'</b><span class="muted" style="font-size:12px;font-weight:400">'+esc(w[2])+'</span></button>').join("")+
  '<div class="hint">В рабочей версии каждый входит под своим именем по PIN или через Битрикс24.</div></div></div>';
  document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>call("login",b.dataset.demo,"1111").then(r=>{S.token=r.token;S.user=r.user;saveSess();V.scope=myEx()?"mine":"all";V.tab="dash";load();}));
}

/* ---------- загрузка ---------- */
function load(silent){
  return call("bootstrap",S.token).then(d=>{S.user=d.user;saveSess();S.items=d.items.map(enrich);buildMonths();S.issues=d.issues;S.log=d.log;S.rev=d.rev;S.asof=d.asof;
    if(!silent||!$("view"))renderShell();else renderView();}).catch(fail);
}
setInterval(()=>{if(!S.token||document.hidden)return;
  call("getRev",S.token).then(r=>{if(r!==S.rev&&!(V.drawer&&V.drawer.dirty))load(true);}).catch(()=>{});},45000);

/* ---------- каркас ---------- */
function tabs(){const t=[["dash","Сводка"],["works","Работы"],["issues","Вопросы"],["log","Журнал"]];if(isAdmin())t.push(["users","Пользователи"]);return t;}
function renderShell(){
  $("root").innerHTML=(REAL?"":'<div class="demo">Демонстрация: изменения не сохраняются · <button class="linkbtn" id="demoswitch" type="button">сменить роль</button></div>')+
  '<header class="bar"><div class="bar-in"><div class="brand">Текущий ремонт</div><nav class="tabs" role="tablist">'+
  tabs().map(t=>'<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(V.tab===t[0])+'">'+t[1]+'</button>').join("")+
  '</nav><div class="who"><span class="nm">'+esc(S.user.name)+'</span><span class="role">'+esc(S.user.role)+'</span><button class="linkbtn" id="out" type="button"'+(IN_BX?" hidden":"")+'>Выйти</button></div></div></header>'+
  '<main id="view"></main><div id="dr"></div>';
  if($("demoswitch"))$("demoswitch").onclick=()=>{S.token=null;S.user=null;saveSess();renderLogin();};
  $("out").onclick=()=>{call("logout",S.token).catch(()=>{});S.token=null;S.user=null;saveSess();renderLogin();};
  renderView();
}
function renderView(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===V.tab));
  ({dash:renderDash,works:renderWorks,issues:renderIssues,log:renderLog,users:renderUsers}[V.tab]||renderDash)();
  if(V.drawer)renderDrawer();
}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-tab]");if(t){V.tab=t.dataset.tab;renderView();window.scrollTo(0,0);}});

function scoped(){return S.items.filter(i=>V.scope!=="mine"||!myEx()||i.ex===myEx());}
function scopeSeg(){return myEx()?'<div class="seg" id="scope"><button type="button" data-s="mine" aria-pressed="'+(V.scope==="mine")+'">Мои ('+esc(myEx())+')</button><button type="button" data-s="all" aria-pressed="'+(V.scope!=="mine")+'">Все работы</button></div>':"";}
function bindScope(){const s=$("scope");if(s)s.onclick=e=>{const b=e.target.closest("[data-s]");if(b){V.scope=b.dataset.s;renderView();}};}

/* ---------- сводка ---------- */
// полоса стадий: сегменты по ходу работы, перед «на зиму» и «нужно решение» — промежуток
function stackHtml(list,cls){
  const l=list.filter(i=>i.g!=="cancel"),n=l.length,c=cls||"stack";if(!n)return'<div class="'+c+'"></div>';
  let out="",side=false;
  ORDER.forEach(k=>{const m=l.filter(i=>i.g===k).length;if(!m)return;
    if(c==="pipe"&&(k==="winter"||k==="attn")&&!side&&out){out+='<span class="gap"></span>';side=true;}
    out+='<span class="g-'+k+'" style="flex:'+m+'" data-tip="'+esc(SHORT[k])+': '+m+' ('+Math.round(m*100/n)+'%)"></span>';});
  return'<div class="'+c+'">'+out+'</div>';
}
const dmy=d=>d?d.split("-").reverse().join("."):"";
function renderDash(){
  const all=scoped(),plan=all.filter(i=>i.g!=="cancel"),N=plan.length,cancelN=all.length-N,mine=!!(myEx()&&V.scope==="mine");
  const C={},OD={};ORDER.forEach(k=>{C[k]=plan.filter(i=>i.g===k).length;OD[k]=plan.filter(i=>i.g===k&&i.overdue).length;});
  const pc=n=>N?Math.round(n*100/N):0,doneN=C.noact+C.done,open=plan.filter(i=>!i.closed),actlate=plan.filter(i=>i.actlate).length;

    '<dl class="dl"><dt>Месяц</dt><dd>'+esc(mname(it.month))+(it.moved?' <span class="faint">(перенесено из '+esc(mfrom(it.month0))+')</span>':"")+'</dd><dt>Упр. компания</dt><dd>'+esc(it.uk||"—")+'</dd><dt>Вид работ</dt><dd>'+esc(it.cat||"—")+'</dd>'+
     '<dt>Основание</dt><dd>'+esc(it.basis||"не указано")+'</dd><dt>Оценка</dt><dd class="num">'+money(it.sum)+(it.fsum?' · факт '+money(it.fsum):"")+'</dd>'+
     '<dt>Мастер</dt><dd>'+esc(it.master||"не назначен")+'</dd>'+
     (it.bxStage||it.bxDates?'<dt>Битрикс24</dt><dd>'+esc([it.bxStage,it.bxDates].filter(Boolean).join(" · "))+'</dd>':'<dt>Битрикс24</dt><dd class="faint">карточки нет</dd>')+
     (it.src?'<dt>Источники</dt><dd>'+esc(it.src)+'</dd>':"")+(it.kr?'<dt>Капремонт</dt><dd>'+esc(it.kr)+'</dd>':"")+
     (it.doneAt?'<dt>Выполнено</dt><dd>'+when(it.doneAt).split(" ")[0]+'</dd>':"")+(it.act?'<dt>Акт</dt><dd>'+esc(it.act)+'</dd>':"")+
     (it.at?'<dt>Изменено</dt><dd>'+esc(it.by)+', '+when(it.at)+'</dd>':"")+'</dl>'+
    (ed?'<div class="box"><h4>Отметить</h4><label class="field">Статус<select id="ds"'+(stLocked?" disabled":"")+'>'+stOpts+'</select></label>'+
       (stLocked?'<div class="lock">Работа принята или снята администратором — статус меняет только он.</div>':!isAdmin()?'<div class="lock">Когда закончите, ставьте «Выполнено, акта нет». Принимает работу администратор.</div>':"")+
       (isAdmin()?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="field">Исполнитель<select id="de">'+EXS.map(e=>opt(e,e,it.ex)).join("")+'</select></label>'+
         '<label class="field">Месяц<select id="dm">'+MONTHS.map(m=>opt(m[0],m[1],it.month)).join("")+'</select></label>'+
         '<label class="field">Факт, ₽<input id="df" inputmode="decimal" value="'+(it.fsum||"")+'"></label>'+
         '<label class="field">Акт (№, дата)<input id="da" maxlength="200" value="'+esc(it.act||"")+'"></label>'+
         '<label class="field" style="grid-column:1/-1">Мастер участка<input id="dmr" list="mlist" maxlength="80" value="'+esc(it.master||"")+'"></label><datalist id="mlist">'+masters().filter(m=>m!=="—").map(m=>'<option value="'+esc(m)+'">').join("")+'</datalist></div>':"")+
       '<label class="field">Комментарий<textarea id="dn" maxlength="2000" placeholder="Что сделано, что мешает">'+esc(it.note)+'</textarea></label></div>'
     :'<div class="box"><h4>Комментарий</h4><div style="font-size:13px;white-space:pre-wrap">'+(it.note?esc(it.note):'<span class="faint">нет</span>')+'</div><div class="lock">Эту работу отмечает '+(it.ex==="Не распределено"?"администратор":"роль «"+esc(it.ex)+"»")+'.</div></div>')+
    histHtml(D.hist)+
   '</div>'+(ed?'<div class="df"><button class="btn primary" id="dsave" type="button" disabled>Сохранить</button><button class="btn" id="dcancel" type="button">Закрыть</button><span class="msg" id="dmsg"></span></div>':"")+'</aside>';
  $("dx").onclick=closeDrawer;$("scrim").onclick=closeDrawer;
  if(!ed)return;
  $("dcancel").onclick=closeDrawer;
  const dirty=()=>{const p=patch();D.dirty=Object.keys(p).length>0;$("dsave").disabled=!D.dirty;};
  const patch=()=>{const p={};if($("ds").value!==it.status)p.status=$("ds").value;if($("dn").value.trim()!==it.note)p.note=$("dn").value;
    if($("de")&&$("de").value!==it.ex)p.ex=$("de").value;if($("dm")&&$("dm").value!==it.month)p.month=$("dm").value;
    if($("df")){const f=$("df").value.replace(/\s/g,"").replace(",",".");if(f!==String(it.fsum||""))p.fsum=f;}
    if($("da")&&$("da").value.trim()!==(it.act||""))p.act=$("da").value;
    if($("dmr")&&$("dmr").value.trim()!==(it.master||""))p.master=$("dmr").value;return p;};
  if($("dchk"))$("dchk").onclick=()=>{$("dchk").disabled=true;call("updateWork",S.token,it.key,{check:""}).then(n=>{Object.assign(it,n);enrich(it);toast("Отмечено как сверенное");renderDrawer();load(true);}).catch(e=>{$("dchk").disabled=false;fail(e);});};
  ["ds","dn","de","dm","df","da","dmr"].forEach(id=>{const el=$(id);if(el){el.addEventListener("input",dirty);el.addEventListener("change",dirty);}});
  $("dsave").onclick=()=>{const p=patch();$("dsave").disabled=true;$("dmsg").textContent="Сохраняем…";
    call("updateWork",S.token,it.key,p).then(n=>{Object.assign(it,n);enrich(it);toast("Сохранено");V.drawer=null;$("dr").innerHTML="";load(true);}).catch(e=>{$("dmsg").textContent="";$("dsave").disabled=false;fail(e);});};
}
// где работа сейчас: шкала по ходу работы или отметка, что она вне хода
function stepHtml(it){
  const F=[["todo","Не начато"],["prog","В работе"],["noact","Выполнено"],["done","Принято с актом"]],ix=F.findIndex(f=>f[0]===it.g);
  if(ix>=0)return'<ol class="steps g-'+it.g+'" aria-label="Стадия">'+F.map((f,n)=>'<li class="'+(n<ix?"past":n===ix?"cur":"")+'"'+(n===ix?' aria-current="step"':"")+'>'+f[1]+'</li>').join("")+'</ol>';
  const msg={attn:"Работа стоит: нужно решение",winter:"Отложено на зиму",cancel:"Снято с плана"}[it.g]||it.status;
  return'<div class="stop g-'+it.g+'"><b>'+esc(msg)+'</b>'+(it.status&&it.status!==G_NAME[it.g]&&it.status!=="Снято"?' — '+esc(it.status.toLowerCase()):"")+'</div>';
}
function histHtml(h){return'<div id="dhist">'+(h&&h.length?'<h4 style="margin:0 0 8px;font-size:13px">История</h4><ul class="hist">'+h.map(x=>'<li>'+when(x.at)+' · '+esc(x.by)+': '+esc(x.what.toLowerCase())+(x.to?' → '+esc((x.what==="Перенос срока"?mname(x.to):x.to).slice(0,80)):"")+'</li>').join("")+'</ul>':"")+'</div>';}
function renderAdd(host){
  const addrs=[...new Set(S.items.map(i=>i.addr))].sort(),uks=[...new Set(S.items.map(i=>i.uk).filter(Boolean))].sort();
  host.innerHTML='<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="Новая работа"><div class="dh"><h3>Новая работа</h3><button class="x" id="dx" type="button" aria-label="Закрыть">×</button></div>'+
  '<form class="db" id="af"><label class="field">Адрес<input id="aa" list="al" required></label><datalist id="al">'+addrs.map(a=>'<option value="'+esc(a)+'">').join("")+'</datalist>'+
  '<label class="field">Что сделать<input id="aw" required></label>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="field">Месяц<select id="am">'+MONTHS.filter(m=>m[0]>=TODAY.slice(0,7)).map(m=>opt(m[0],m[1],TODAY.slice(0,7))).join("")+'</select></label>'+
  '<label class="field">Исполнитель<select id="ae">'+EXS.map(e=>opt(e,e,"Не распределено")).join("")+'</select></label>'+
  '<label class="field">Управляющая компания<select id="au">'+uks.map(u=>opt(u,u,"")).join("")+'</select></label><label class="field">Оценка, ₽<input id="as" inputmode="decimal"></label></div>'+
  '<label class="field">Основание<input id="ab" placeholder="Заявление, акт, протокол"></label></form>'+
  '<div class="df"><button class="btn primary" id="asave" type="button">Добавить</button><button class="btn" id="acancel" type="button">Отмена</button></div></aside>';
  $("dx").onclick=closeDrawer;$("scrim").onclick=closeDrawer;$("acancel").onclick=closeDrawer;
  $("aa").onchange=()=>{const x=S.items.find(i=>i.addr===$("aa").value.trim());if(x&&x.uk)$("au").value=x.uk;};
  $("asave").onclick=()=>{const w={addr:$("aa").value.trim(),work:$("aw").value.trim(),month:$("am").value,ex:$("ae").value,uk:$("au").value,sum:$("as").value.replace(/\s/g,"").replace(",","."),basis:$("ab").value.trim()};
    if(!w.addr||!w.work){toast("Укажите адрес и что сделать");return;}
    $("asave").disabled=true;call("addWork",S.token,w).then(()=>{toast("Работа добавлена");closeDrawer();load(true);}).catch(e=>{$("asave").disabled=false;fail(e);});};
}

/* ---------- загрузка обновления из выгрузок (администратор) ---------- */
const IMP_LABELS={status:"статус",bx:"Битрикс24",master:"мастер",ex:"исполнитель",month:"месяц",act:"акт",fsum:"факт",sum:"оценка",uk:"упр. компания",check:"сверка"};
function impPreview(r){
  const row=(t,n,hint)=>'<div class="imp-row'+(n?"":" zero")+'"><span>'+t+(hint?'<small>'+hint+'</small>':"")+'</span><b>'+n+'</b></div>';
  const det=(t,l,f)=>l.length?'<details class="imp-det"><summary>'+t+'</summary><ul>'+l.map(f).join("")+'</ul></details>':"";
  const ch=Object.keys(IMP_LABELS).filter(k=>r.changes[k]).map(k=>IMP_LABELS[k]+" — "+r.changes[k]).join(", ");
  const none=!r.added&&!r.updated&&!r.flagged;
  return'<div class="box"><h4>Файл от '+esc(dmy(r.generated))+' · работ в файле: '+r.total+'</h4>'+
    row("Новые работы",r.added,"появятся в списке")+
    row("Обновятся",r.updated,ch?"из них: "+esc(ch):"")+
    row("На сверку",r.flagged,"источники опережают отметку сотрудника, работа получит метку «сверить»")+
    row("Не откатываем назад",r.kept,"источники отстают от трекера, статус остаётся")+
    row("Нет в файле",r.missing,"остаются в таблице без изменений")+
    (r.invalid?row("Не прочитано",r.invalid,esc(r.errors.join("; "))):"")+
    '</div>'+(none?'<div class="box chkbox">Изменений нет: в таблице уже есть эти данные.</div>':"")+
    det("Новые работы",r.addedList,x=>'<li>'+esc(x.addr)+' — '+esc(x.work.slice(0,90))+' ('+esc(mname(x.month))+')</li>')+
    det("Изменятся статусы",r.statusList,x=>'<li>'+esc(x.addr)+' — '+esc(x.work.slice(0,70))+': '+esc(x.from)+' → '+esc(x.to)+'</li>')+
    det("На сверку",r.flagList,x=>'<li>'+esc(x.addr)+' — '+esc(x.work.slice(0,70))+'<br><span class="faint">'+esc(x.text)+'</span></li>')+
    det("Нет в файле",r.missingList,x=>'<li>'+esc(x.addr)+' — '+esc(x.work.slice(0,90))+'</li>');
}
function renderImport(host){
  const D=V.drawer,r=D.rep;
  host.innerHTML='<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="Загрузка обновления"><div class="dh"><h3>Загрузить обновление</h3><button class="x" id="dx" type="button" aria-label="Закрыть">×</button></div>'+
  '<div class="db"><p class="muted" style="margin:0;font-size:13px">Выберите файл «Обновление для трекера … .json». Отметки сотрудников не стираются: если источники опережают их отметку, работа получит метку «сверить». Работы, которых нет в файле, не удаляются.</p>'+
  '<label class="field">Файл обновления<input id="impf" type="file" accept=".json,application/json"></label>'+
  (D.name?'<div class="faint" style="font-size:12px">'+esc(D.name)+(D.busy&&!r?" — проверяю…":"")+'</div>':"")+
  (D.err?'<div class="imp-err" role="alert">'+esc(D.err)+'</div>':"")+(r?impPreview(r):"")+'</div>'+
  '<div class="df"><button class="btn primary" id="impgo" type="button"'+(r&&(r.added||r.updated||r.flagged)&&!D.busy?"":" disabled")+'>Применить</button><button class="btn" id="impx" type="button">Закрыть</button><span class="msg" id="impmsg"></span></div></aside>';
  $("dx").onclick=closeDrawer;$("scrim").onclick=closeDrawer;$("impx").onclick=closeDrawer;
  const gone=er=>{D.busy=false;if(String((er&&er.message)||er).indexOf("SESSION_EXPIRED")>=0){fail(er);return;}D.err=(er&&er.message)||String(er);if(V.drawer===D)renderImport(host);};
  $("impf").onchange=e=>{const f=e.target.files[0];if(!f)return;
    if(f.size>5e6){D.err="Файл больше 5 МБ. Это не файл обновления.";D.rep=null;D.name=f.name;renderImport(host);return;}
    const rd=new FileReader();
    rd.onload=()=>{D.text=String(rd.result);D.name=f.name;D.rep=null;D.err="";D.busy=true;renderImport(host);
      call("importWorks",S.token,D.text,false).then(rep=>{D.rep=rep;D.busy=false;if(V.drawer===D)renderImport(host);}).catch(gone);};
    rd.onerror=()=>gone(new Error("Не удалось прочитать файл."));
    rd.readAsText(f,"utf-8");};
  $("impgo").onclick=()=>{D.busy=true;$("impgo").disabled=true;$("impmsg").textContent="Записываю…";
    call("importWorks",S.token,D.text,true).then(rep=>{toast("Обновление применено: добавлено "+rep.added+", обновлено "+rep.updated+(rep.flagged?", на сверку "+rep.flagged:""));closeDrawer();load(true);}).catch(gone);};
}

/* ---------- вопросы, журнал, пользователи ---------- */
function renderIssues(){
  const open=S.issues.filter(i=>!i.done).length;
  $("view").innerHTML='<div class="head"><h2>Открытые вопросы</h2><span class="muted">'+open+' из '+S.issues.length+' открыто</span></div>'+
  (isAdmin()?'<form class="card" id="qf" style="display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:12px">'+
    '<label class="field">Новый вопрос<input id="qt" maxlength="1000" placeholder="Что нужно решить"></label><label class="field">Ответственный<input id="qr" maxlength="80"></label>'+
    '<label class="field">Срок<input id="qd" maxlength="40" placeholder="до 15.10"></label><button class="btn primary" type="submit">Добавить</button></form>':"")+
  '<div class="list"><ul class="ilist">'+
  S.issues.slice().sort((a,b)=>a.done-b.done).map(i=>'<li class="'+(i.done?"done":"")+'"><input type="checkbox" data-iss="'+i.num+'"'+(i.done?" checked":"")+(isAdmin()?"":" disabled")+' aria-label="Вопрос решён">'+
   '<div><div class="t">'+esc(i.text)+'</div><div class="meta"><span>'+esc(i.resp)+'</span><span>срок: '+esc(i.term)+'</span>'+(i.done&&i.by?'<span>закрыл '+esc(i.by)+' '+when(i.at)+'</span>':"")+'</div></div></li>').join("")+'</ul></div>';
  if($("qf"))$("qf").onsubmit=e=>{e.preventDefault();const t=$("qt").value.trim();if(!t){toast("Опишите вопрос");return;}
    call("addIssue",S.token,{text:t,resp:$("qr").value,term:$("qd").value}).then(is=>{S.issues=is;toast("Вопрос добавлен");renderIssues();}).catch(fail);};
  document.querySelectorAll("[data-iss]").forEach(c=>c.onchange=()=>{c.disabled=true;call("setIssue",S.token,+c.dataset.iss,c.checked).then(()=>load(true)).catch(e=>{c.checked=!c.checked;c.disabled=false;fail(e);});});
}
function renderLog(){
  $("view").innerHTML='<div class="head"><h2>Журнал изменений</h2><span class="muted">последние '+S.log.length+'</span></div><div class="list">'+
  (S.log.length?'<ul class="ilist loglist">'+S.log.map(l=>'<li><div><div class="t"><b>'+esc(l.addr||"Вопрос")+'</b> · '+esc(l.work.slice(0,90))+'</div><div class="meta"><span>'+when(l.at)+'</span><span>'+esc(l.by)+'</span><span>'+esc(l.what)+(l.from?': '+esc((l.what==="Перенос срока"?mname(l.from):l.from).slice(0,60))+' →':":")+' <b>'+esc((l.what==="Перенос срока"?mname(l.to):l.to).slice(0,80))+'</b></span></div></div></li>').join("")+'</ul>':'<div class="empty">Изменений пока нет.</div>')+'</div>';
}
function renderUsers(){
  if(!isAdmin()){V.tab="dash";return renderView();}
  $("view").innerHTML='<div class="head"><h2>Пользователи</h2></div><div class="list" id="ul"><div class="empty">Загрузка…</div></div>'+
   '<form class="uform card" id="uf"><input type="hidden" id="uo"><label class="field">Имя<input id="un" required></label><label class="field">Роль<select id="ur">'+ROLES.map(r=>opt(r,r,"УК")).join("")+'</select></label>'+
   '<label class="field">PIN (4–8 цифр)<input id="up" inputmode="numeric" maxlength="8" placeholder="не менять"></label><label class="field">ID в Битрикс24<input id="ub" inputmode="numeric" maxlength="12" placeholder="для входа из портала"></label><label class="chk"><input type="checkbox" id="ua" checked> Активен</label>'+
   '<button class="btn primary" type="submit">Сохранить</button></form>'+
   '<p class="faint" style="font-size:12px;max-width:70ch">Администратор меняет всё. УК и Подрядчики отмечают статус и комментарий только в своих работах. Просмотр — без изменений. PIN хранится в таблице в виде хэша. Сотрудник, впервые открывший трекер из Битрикс24, появляется здесь сам с ролью «Просмотр» — назначьте ему роль. ID в Битрикс24 — число из адреса профиля: …/company/personal/user/<b>15</b>/.</p>';
  const draw=us=>{$("ul").innerHTML='<table class="utable"><thead><tr><th>Имя</th><th>Роль</th><th>Вход</th><th>Статус</th><th></th></tr></thead><tbody>'+
    us.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.role)+'</td><td class="muted">'+[u.bxId?"Битрикс24 · "+esc(u.bxId):"",u.hasPin?"PIN":""].filter(Boolean).join(" · ")+'</td><td>'+(u.active?"активен":'<span class="faint">отключён</span>')+'</td><td><button class="linkbtn" data-u="'+esc(u.name)+'" data-r="'+esc(u.role)+'" data-a="'+u.active+'" data-b="'+esc(u.bxId||"")+'" type="button">Изменить</button></td></tr>').join("")+'</tbody></table>';
    document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{$("uo").value=b.dataset.u;$("un").value=b.dataset.u;$("ur").value=b.dataset.r;$("ua").checked=b.dataset.a==="true";$("ub").value=b.dataset.b;$("up").value="";$("un").focus();});};
  call("listUsers",S.token).then(draw).catch(fail);
  $("uf").onsubmit=e=>{e.preventDefault();call("saveUser",S.token,{oldName:$("uo").value,name:$("un").value.trim(),role:$("ur").value,active:$("ua").checked,pin:$("up").value.trim(),bxId:$("ub").value.trim()})
    .then(us=>{draw(us);toast("Сохранено");$("uf").reset();$("uo").value="";}).catch(fail);};
}

/* ---------- старт ---------- */
if(BOOT&&BOOT.session){S.token=BOOT.session.token;S.user=BOOT.session.user;saveSess();V.scope=myEx()?"mine":"all";load();}
else if(S.token)load();else renderLogin();
})();
</script>
