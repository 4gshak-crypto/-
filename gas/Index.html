<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер текущего ремонта</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: шапка с вкладками; «Сводка» сверху вниз отвечает на вопросы: где мы (стадии) → где проблемы → когда (месяцы) → кто отстаёт → где (адреса, виды работ); «Работы» — список с быстрыми фильтрами по стадиям, детали в боковой панели */
:root{
  --bg:#f3f4f2; --surface:#fff; --surface-2:#eceeea; --line:#dde1da; --line-strong:#bcc2b8;
  --fg:#1d2420; --muted:#5b665f; --faint:#8a948d;
  --accent:#1f5f8b; --accent-ink:#fff; --accent-soft:#dde9f2;
  /* стадии: метка на графике · текст · подложка. Палитра проверена на различимость соседних стадий, в том числе при дальтонизме */
  --todo:#8b939b; --todo-ink:#4f5860; --todo-bg:#eceef0;
  --prog:#1859a6; --prog-ink:#164f93; --prog-bg:#e1ebf7;
  --noact:#d29b00; --noact-ink:#7f5b00; --noact-bg:#faf0d2;
  --done:#2e7d3a; --done-ink:#256b30; --done-bg:#e0f1e2;
  --winter:#8a5cc2; --winter-ink:#6d45a6; --winter-bg:#efe8f8;
  --attn:#c0392b; --attn-ink:#a8321f; --attn-bg:#fbe5e1;
  --cancel:#a3a8a4; --cancel-ink:#6b716d; --cancel-bg:#eceeec;
  --ex-pto:#4f5f6b; --ex-own:#a9530b; --ex-none:#8a948d;
  --banner:#fbefd6;
  --shadow:0 10px 40px rgba(20,30,25,.18);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --surface:#1c2320; --surface-2:#252d29; --line:#2f3833; --line-strong:#47524b;
  --fg:#e5ebe7; --muted:#a3ada7; --faint:#77827b; --accent:#6fb0de; --accent-ink:#0d1b25; --accent-soft:#1d3342;
  --todo:#5d6772; --todo-ink:#b4bcc4; --todo-bg:#2a3036; --prog:#4893e3; --prog-ink:#8ec0f5; --prog-bg:#1b2f47;
  --noact:#cfa22e; --noact-ink:#f0cc6a; --noact-bg:#3a2f12; --done:#2a8040; --done-ink:#7fd08c; --done-bg:#1b3520;
  --winter:#8f74d8; --winter-ink:#c4b2f2; --winter-bg:#2c2540; --attn:#d95a49; --attn-ink:#ff9b8c; --attn-bg:#3d1f1b;
  --cancel:#6f7672; --cancel-ink:#a4aba7; --cancel-bg:#2a302c; --ex-pto:#a9b8c3; --ex-own:#f3a35e; --ex-none:#77827b;
  --banner:#3a2d12; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
[hidden]{display:none!important}

/* shell */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs button{border:0;background:none;padding:18px 12px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.who{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:13px}
.role{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
@media (max-width:720px){.brand{display:none}.who .nm,.who .role{display:none}.bar-in{gap:8px}.tabs button{padding:18px 9px 16px}}

.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.ctl{padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.2}
.err{color:var(--attn-ink);font-size:13px;min-height:18px}
.hint{font-size:12px;color:var(--faint)}

/* цвета стадий и исполнителей: --c метка, --ci текст, --cb подложка */
.g-todo{--c:var(--todo);--ci:var(--todo-ink);--cb:var(--todo-bg)} .g-prog{--c:var(--prog);--ci:var(--prog-ink);--cb:var(--prog-bg)}
.g-noact{--c:var(--noact);--ci:var(--noact-ink);--cb:var(--noact-bg)} .g-done{--c:var(--done);--ci:var(--done-ink);--cb:var(--done-bg)}
.g-winter{--c:var(--winter);--ci:var(--winter-ink);--cb:var(--winter-bg)} .g-attn{--c:var(--attn);--ci:var(--attn-ink);--cb:var(--attn-bg)}
.g-cancel{--c:var(--cancel);--ci:var(--cancel-ink);--cb:var(--cancel-bg)}
.e-pto{--ci:var(--ex-pto)} .e-own{--ci:var(--ex-own)} .e-none{--ci:var(--ex-none)}
.fill{background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ci);background:var(--cb)}
.pill.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;font-weight:600;color:var(--ci)}
.chkpill{font-size:10px;font-weight:600;border:1px dashed var(--line-strong);color:var(--muted);border-radius:999px;padding:0 7px;white-space:nowrap}
.bad{color:var(--attn-ink);font-weight:600}

/* сводка */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:16px}
.head h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card+.card,.grid2+.card,.card+.grid2,.grid2+.grid2{margin-top:12px}
.card h3{margin:0;font-size:15px;font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.card h3 span{font-weight:400;color:var(--muted);font-size:12px}
.card .sub{font-size:12px;color:var(--muted);margin:2px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2>.card{margin-top:0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px;margin:10px 0 14px}
.hero-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-big{font-family:var(--f-display);font-size:34px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.hero-txt{font-size:14px;max-width:60ch}
.money{font-size:12px;color:var(--muted)}
.pipe{display:flex;gap:2px;height:28px}
.pipe span{min-width:4px;background:var(--c)}
.pipe span:first-child{border-radius:6px 0 0 6px} .pipe span:last-child{border-radius:0 6px 6px 0}
.pipe .gap{flex:0 0 8px;background:transparent;min-width:0}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) repeat(2,minmax(0,.85fr));column-gap:22px;row-gap:10px;margin-top:12px}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.stage:hover{border-color:var(--c)}
.stage.side{border-style:dashed}
.stage.arrow::after{content:"→";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px}
.stage .sh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ci)}
.stage .sh i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.stage .sn{font-family:var(--f-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stage .sp{font-size:12px;color:var(--muted)}
.stage .sx{font-size:12px;font-weight:600;color:var(--attn-ink);min-height:18px}
.stage .sx.ok{color:var(--muted);font-weight:400}
@media (max-width:900px){.stages{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px}.stage.arrow::after{display:none}}
.note{font-size:12px;color:var(--faint);margin:10px 0 0}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:4px 56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 0;border-top:1px solid var(--line);cursor:pointer}
.plist li:first-child{border-top:0}
.plist li:hover{background:var(--surface-2)}
.plist .sv{align-self:stretch;border-radius:2px;background:var(--c)}
.plist .pn{font-family:var(--f-display);font-size:20px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.plist .pt{min-width:0} .plist .pt b{display:block;font-size:13px;font-weight:600} .plist .pt span{font-size:12px;color:var(--muted)}
.plist .pa{font-size:12px;color:var(--accent);white-space:nowrap}
.sev-high{--c:var(--attn)} .sev-mid{--c:var(--noact)} .sev-low{--c:var(--todo)}
@media (max-width:560px){.plist .pa{display:none}.plist li{grid-template-columns:4px 44px minmax(0,1fr);gap:10px}}
.mrow{display:grid;grid-template-columns:168px minmax(0,1fr) 104px;gap:10px;align-items:center;padding:6px 4px;cursor:pointer;border-radius:6px}
.mrow:hover{background:var(--surface-2)}
.mrow .ml{font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.mb{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;font-style:normal}
.mb.late{color:var(--attn-ink);background:var(--attn-bg)} .mb.now{color:var(--prog-ink);background:var(--prog-bg)}
.mb.ok{color:var(--done-ink);background:var(--done-bg)} .mb.next{color:var(--muted);background:var(--surface-2)} .mb.wait{color:var(--noact-ink);background:var(--noact-bg)}
.mrow .mv{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.mrow{grid-template-columns:120px minmax(0,1fr) 72px}.mrow .mv span{display:none}}
.stack{display:flex;gap:2px;height:14px}
.stack span{height:100%;min-width:3px;background:var(--c)}
.stack span:first-child{border-radius:4px 0 0 4px} .stack span:last-child{border-radius:0 4px 4px 0} .stack span:only-child{border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.tscroll{overflow-x:auto;margin:0 -4px}
.wt{width:100%;border-collapse:collapse;font-size:13px;min-width:780px}
.wt th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.wt th i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:4px}
.wt th:first-child,.wt td:first-child{text-align:left}
.wt td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wt tbody tr{cursor:pointer} .wt tbody tr:hover{background:var(--surface-2)}
.wt .z{color:var(--faint)}
@media (max-width:640px){.wt{min-width:0}.wt .st{display:none}.wt th,.wt td{padding:8px 5px}.wt th,.wt td:first-child{white-space:normal}.wt .pbar{gap:6px}.wt .pbar i{width:30px}}
.pbar{display:inline-flex;align-items:center;gap:8px} .pbar i{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i b{display:block;height:100%;background:var(--done)}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 34px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.hbar .lbl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar:hover .lbl{color:var(--accent)}
.hbar .tr{height:10px}
.hbar .tr i{display:block;height:100%;background:var(--attn);border-radius:0 4px 4px 0;min-width:3px}
.hbar .val{font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.alist li:first-child{border-top:0}
.alist li:hover .a{color:var(--accent)}
.alist .a{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist .m{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.hbar{grid-template-columns:minmax(0,120px) minmax(0,1fr) 30px}.alist li{flex-direction:column;align-items:flex-start;gap:4px}.alist .a{max-width:100%}}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap}

.hrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px}

/* работы */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters .ctl{width:auto;flex:0 1 auto}
.filters .search{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--fg)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)} .chip[aria-pressed="true"] b{color:var(--bg)}
.fpills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.fpill{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:3px 4px 3px 10px}
.fpill button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 5px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;user-select:none}
.count{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wr{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 0;border-top:1px solid var(--line);cursor:pointer}
.wr:first-child{border-top:0}
.wr:hover{background:var(--surface-2)}
.wr .sev{align-self:stretch;background:var(--c)}
.wr .a{font-weight:600;font-size:13px}
.wr .w{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wr .od{font-size:11px;color:var(--attn-ink);font-weight:600}
.wr .al{font-size:11px;color:var(--noact-ink);font-weight:600}
.lock{font-size:11px;color:var(--faint)}
.more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);cursor:pointer;font-weight:500}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* панель работы */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:16px;line-height:1.3}
.dh .x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.db{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.steps{display:flex;list-style:none;margin:0;padding:0;gap:4px}
.steps li{flex:1;font-size:11px;color:var(--faint);text-align:center;position:relative;padding-top:12px}
.steps li::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:3px;background:var(--surface-2)}
.steps li.past::before,.steps li.cur::before{background:var(--c)}
.steps li.cur{color:var(--fg);font-weight:600}
.stop{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--cb);color:var(--ci)}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;word-break:break-word}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.box.chkbox{border-style:dashed;border-color:var(--line-strong);background:var(--surface-2)}
.box h4{margin:0;font-size:13px}
.hist{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.df .msg{font-size:12px;color:var(--muted);margin-left:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.phcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.phc h5{margin:0 0 6px;font-size:12px;font-weight:600}
.phg{display:flex;flex-wrap:wrap;gap:6px}
.pht{width:64px;height:64px;padding:0;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.pht img{width:100%;height:100%;object-fit:cover;display:block}
.pha{position:relative;width:64px;height:64px;border:1px dashed var(--line-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;cursor:pointer}
.pha input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pha:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pha.off{opacity:.45;pointer-events:none}
.lbx{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}
.lbs{position:absolute;inset:0;background:rgba(10,15,12,.86)}
.lbx figure{position:relative;margin:0;max-width:min(94vw,980px);max-height:94vh;display:flex;flex-direction:column;gap:10px;align-items:center}
.lbimg{min-height:100px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.lbimg img{max-width:100%;max-height:70vh;border-radius:6px;background:#000}
.lbx figcaption{color:#fff;font-size:13px;text-align:center}

<script>window.BOOT=<?!= BOOT ?>;</script>
<script>
/* kr:start */
/* Страница «Капитальный ремонт»: KrView.mount(контейнер, данные, {today, title, actions}).
   Данные — результат tools/kr_parse.py + flood_parse.py (или gas/kr_import.js в браузере). Правится здесь; build.py и tools/build_kr.py вставляют этот файл в страницы. */
var KrView=(function(){
'use strict';
function mount(root,D,opts){
opts=opts||{};
const T=opts.today||D.today,P=D.positions.map(p=>Object.assign({},p));
P.forEach(p=>{if(!p.flood&&D.flood&&D.flood.by)p.flood=D.flood.by[p.hk]||null;});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dmy=d=>d?d.split("-").reverse().join("."):"";
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c;};
const rub=n=>Math.round(n).toLocaleString("ru-RU")+" ₽";
const mln=n=>(n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн ₽";
const gen=n=>n+" "+(n%10===1&&n%100!==11?"позиции":"позиций"),dat=n=>n+" "+(n%10===1&&n%100!==11?"позиции":"позициям");
const sum=(l,f)=>l.reduce((s,p)=>s+(f(p)||0),0);
const day=iso=>Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/864e5;

/* этапы по проценту выполнения: статуса в файле нет */
const ST=[["todo","Процент не указан","нет данных о ходе работ"],["prog","В работе","процент от 1 до 99"],["done","Выполнено","процент 100"],["stop","Встали","в файле отметка «встали»"]];
const SN=Object.fromEntries(ST.map(s=>[s[0],s[1]])),G={todo:"todo",prog:"prog",done:"done",stop:"attn"};
const stageOf=p=>p.state?"stop":p.pct===100?"done":p.pct>0?"prog":"todo";
P.forEach(p=>{p.g=stageOf(p);p.w=(p.kr||0)*(p.pct||0)/100;
  p.elapsed=p.start&&p.end&&p.start<p.end?Math.max(0,Math.min(100,(day(T)-day(p.start))/(day(p.end)-day(p.start))*100)):null;});

/* проблемы: что проверяется и кто решает */
const FL=[
 ["stop","high","Работа встала","Подрядчик и УК: причина простоя и новый срок",p=>!!p.state],
 ["endlate","high","Срок окончания прошёл, а выполнено меньше 100%","Подрядчик: новый срок или закрыть работу",p=>p.end&&p.end<T&&(p.pct||0)<100&&!p.state],
 ["behind","high","Выполнение отстаёт от графика (на 15 пунктов и больше)","Подрядчик: что мешает и как наверстать",p=>p.elapsed!=null&&p.end>=T&&p.pct!=null&&p.elapsed-p.pct>=15&&p.pct<100],
 ["latenopct","high","График начала прошёл, а процента выполнения нет","Исполнитель: начата ли работа и сколько сделано",p=>p.start&&p.start<T&&p.pct==null&&!p.state],
 ["vote","high","Нужно переголосование собственников","УК: провести переголосование",p=>p.vote],
 ["floodrep","high","Повторные подтопления после «устранено»","УК: акт совместного обследования и эскалация в Водоканал",p=>!!(p.flood&&p.flood.repeat)],
 ["nocontract","mid","Работа идёт или закончена, а суммы договора в файле нет","ПТО: оформить договор или внести его сумму",p=>p.pct>0&&!p.contract],
 ["floodwait","mid","Подтопление: претензия ждёт ответа","УК: контролировать срок ответа организации",p=>!!(p.flood&&p.flood.gis_pending>0)],
 ["flood","mid","В доме подтапливало подвал (есть в реестре подтоплений)","УК: учесть при планировании работ, контролировать ответы",p=>!!p.flood],
 ["nopay","mid","Аванс из банка есть, работа идёт, а оплаты подрядчику в файле нет","ПТО: внести оплату («Аванс/расчёт») или пояснить",p=>!!p.bank&&!p.pay&&p.pct>0],
 ["noend","mid","Нет срока окончания","ПТО: внести срок",p=>!p.end],
 ["noexec","mid","Не назначен исполнитель по плану","ПТО: назначить исполнителя",p=>!p.executor],
 ["nocontr","mid","Нет основного подрядчика","ПТО: указать подрядчика",p=>!p.contractor],
 ["nostart","low","Нет графика начала работ","ПТО: внести дату начала",p=>!p.start],
 ["shortc","low","Сумма договора меньше суммы КР","ПТО: сверить договор с суммой КР",p=>p.contract&&p.kr&&p.contract<p.kr*.99],
 ["nokr","low","Нет суммы КР","ПТО: внести сумму",p=>!p.kr]];
const SEV={high:"красное срывает сроки",mid:"жёлтое копится",low:"серое — порядок в данных"};
P.forEach(p=>{p.fl=FL.filter(f=>f[4](p)).map(f=>f[0]);p.bad=p.fl.some(k=>!/^flood/.test(k)&&FL.find(f=>f[0]===k)[1]==="high");});
const FLN=Object.fromEntries(FL.map(f=>[f[0],f]));
const SHORTFL={stop:"встали",endlate:"срок прошёл",behind:"отстаёт",latenopct:"старт прошёл",vote:"переголосование",floodrep:"повторные подтопления",floodwait:"подтопление: ждёт ответа",flood:"подтопления",nocontract:"нет договора",nopay:"нет оплаты",noend:"нет срока",noexec:"нет исполнителя",nocontr:"нет подрядчика",nostart:"нет старта",shortc:"договор < КР",nokr:"нет суммы КР"};

/* состояние отбора */
const V0={q:"",stage:"",flag:"",term:"",hk:"",who:"contractor",whoKey:null,open:{}};
let V=opts.state?Object.assign(opts.state,Object.assign({},V0,opts.state)):V0;   // opts.state — чтобы фильтры и раскрытые позиции переживали повторный показ после правки
const list=()=>P.filter(p=>(!V.stage||p.g===V.stage)&&(!V.hk||p.hk===V.hk)&&(!V.flag||p.fl.includes(V.flag))&&(!V.term||termKey(p)===V.term)&&
  (V.whoKey==null||whoVal(p,V.who)===V.whoKey)&&(!V.q||(p.addr+" "+p.lines.map(l=>l.work).join(" ")+" "+p.contractor+" "+p.executor).toLowerCase().includes(V.q.toLowerCase())));
const termKey=p=>p.end?p.end_txt:"—";
const whoVal=(p,w)=>(w==="executor"?p.executor:p.contractor)||"—";
const stack=(l,w)=>{const t=l.length;if(!t)return'<div class="stk"></div>';
  return'<div class="stk">'+ST.map(s=>{const n=l.filter(p=>p.g===s[0]).length;return n?'<span class="g-'+G[s[0]]+'" style="flex:'+n+'" title="'+esc(s[1])+': '+n+'"></span>':"";}).join("")+'</div>';};
const wavg=l=>{const k=sum(l,p=>p.kr);return k?Math.round(sum(l,p=>p.w)*100/k):0;};

function render(){
  const kpi=(n,t,bad)=>'<div'+(bad?' class="bad"':"")+'><div class="n">'+n+'</div><div class="t">'+t+'</div></div>';
  const NH=new Set(P.map(p=>p.hk)).size,N=P.length,KR=sum(P,p=>p.kr),WP=wavg(P),by=Object.fromEntries(ST.map(s=>[s[0],P.filter(p=>p.g===s[0])]));
  const noPctLate=FL[3][4];
  /* 1. где мы сейчас */
  const card=(k,cls,extra)=>{const l=by[k];return'<button type="button" class="stage g-'+G[k]+' '+cls+'" data-stage="'+k+'"><span class="sh"><i></i>'+esc(SN[k])+'</span><span class="sn">'+l.length+'</span><span class="sp">'+mln(sum(l,p=>p.kr))+' · '+(KR?Math.round(sum(l,p=>p.kr)*100/KR):0)+'% суммы</span>'+extra+'</button>';};
  const sx=(n,bad,ok)=>n?'<span class="sx">'+bad+'</span>':'<span class="sx ok">'+ok+'</span>';
  const pipe='<div class="pipe">'+ST.map((s,i)=>{const v=sum(by[s[0]],p=>p.kr);return v?(s[0]==="stop"&&i?'<span class="gap"></span>':"")+'<span class="g-'+G[s[0]]+'" style="flex:'+v+'" data-tip="'+esc(s[1])+': '+mln(v)+'"></span>':"";}).join("")+'</div>';
  const hero='<section class="card"><h3>Где мы сейчас <span>позиции перечня по проценту выполнения</span></h3><div class="hero-top"><div class="hero-l"><span class="hero-big">'+WP+'%</span>'+
    '<span class="hero-txt">выполнено по сумме КР. Всего '+mln(KR)+': '+NH+' '+plural(NH,"дом","дома","домов")+', '+N+' '+plural(N,"позиция","позиции","позиций")+'. На 100% закрыто '+by.done.length+', в работе '+by.prog.length+', процент не указан у '+gen(by.todo.length)+(by.stop.length?', встали '+by.stop.length:"")+'.</span></div>'+
    '<span class="money">Аванс из банка '+mln(sum(P,p=>p.bank))+' · по договорам '+mln(sum(P,p=>p.contract))+'</span></div>'+pipe+
    '<div class="stages s4">'+
      card("todo","flow arrow",sx(by.todo.filter(noPctLate).length,by.todo.filter(noPctLate).length+" — график начала прошёл","срок начала не наступил или не указан"))+
      card("prog","flow arrow",sx(P.filter(p=>p.fl.includes("behind")||p.fl.includes("endlate")).length,P.filter(p=>p.fl.includes("behind")||p.fl.includes("endlate")).length+" — отстают от графика или срок прошёл","по графику"))+
      card("done","flow",'<span class="sx ok">100% по файлу</span>')+
      card("stop","side",sx(by.stop.length,"причина и срок не указаны","нет"))+
    '</div><p class="note">Этап определён по проценту выполнения: отдельного статуса в файле нет. «Выполнено по сумме КР» — это сумма КР × процент выполнения по каждой позиции. Нажмите на карточку, чтобы открыть список.</p></section>';

  /* подтопления подвалов по домам программы */
  const HK={};P.forEach(p=>{(HK[p.hk]=HK[p.hk]||{hk:p.hk,addr:p.addr,l:[]}).l.push(p);});
  const FH=Object.values(HK).filter(h=>h.l[0].flood).sort((a,b)=>b.l[0].flood.total-a.l[0].flood.total);
  let floodCard="";
  if(D.flood&&FH.length){
    const F=D.flood,fs=FH.map(h=>h.l[0].flood),tot=sum(fs,f=>f.total),gis=sum(fs,f=>f.gis),pend=sum(fs,f=>f.gis_pending),rep=fs.filter(f=>f.repeat).length,
      cat=c=>sum(fs,f=>f.cats[c]),ans=sum(["done","done_blame","refuse","plan","third"].map(c=>({v:cat(c)})),x=>x.v),dd=s=>s.slice(0,5);
    floodCard='<section class="card"><h3>Подтопления подвалов <span>реестр на '+esc(F.updated)+' · с '+esc(dd(F.period_start))+' по '+esc(dd(F.period_end))+'</span></h3>'+
      '<div class="sub">В реестре есть '+FH.length+' из '+NH+' '+plural(NH,"дома","домов","домов")+' программы: '+tot+' '+plural(tot,"заявка","заявки","заявок")+' в АДС — '+Math.round(tot*100/F.register_total)+'% всех заявок реестра ('+F.register_total+' по '+F.register_addresses+' адресам). Нажмите на дом, чтобы открыть его позиции.</div>'+
      '<div class="fkpi">'+kpi(tot,plural(tot,"заявка","заявки","заявок")+" в АДС о подтоплении")+kpi(gis,"обращений УК в ГИС ЖКХ"+(pend?", из них "+pend+" без ответа (в "+fs.filter(f=>f.gis_pending).length+" "+plural(fs.filter(f=>f.gis_pending).length,"доме","домах","домах")+")":", все с ответом"),pend>0)+

function scoped(){return S.items.filter(i=>V.scope!=="mine"||!myEx()||i.ex===myEx());}
function scopeSeg(){return myEx()?'<div class="seg" id="scope"><button type="button" data-s="mine" aria-pressed="'+(V.scope==="mine")+'">Мои ('+esc(myEx())+')</button><button type="button" data-s="all" aria-pressed="'+(V.scope!=="mine")+'">Все работы</button></div>':"";}

/* ---------- сводка ---------- */
// полоса стадий: сегменты по ходу работы, перед «на зиму» и «нужно решение» — промежуток
function stackHtml(list,cls){
  const l=list.filter(i=>i.g!=="cancel"),n=l.length,c=cls||"stack";if(!n)return'<div class="'+c+'"></div>';
  let out="",side=false;
  ORDER.forEach(k=>{const m=l.filter(i=>i.g===k).length;if(!m)return;
    if(c==="pipe"&&(k==="winter"||k==="attn")&&!side&&out){out+='<span class="gap"></span>';side=true;}
    out+='<span class="g-'+k+'" style="flex:'+m+'" data-tip="'+esc(SHORT[k])+': '+m+' ('+Math.round(m*100/n)+'%)"></span>';});
  return'<div class="'+c+'">'+out+'</div>';
}
const dmy=d=>d?d.split("-").reverse().join("."):"";
/* ---------- расчёты сводки: общие для страницы и выгрузки в Excel ---------- */
function probList(all,plan,C,OD,open,actlate,mine){
  return[["todo_od","high",OD.todo,"Не начаты, хотя месяц плана прошёл","Исполнитель и ПТО: начать или перенести срок"],
    ["prog_od","high",OD.prog,"В работе дольше плана","Мастер: дата завершения и что мешает"],
    ["attn","high",C.attn,"Работа стоит — нужно решение","Руководство и ПТО: решить или снять с плана"],
    ["actlate","mid",actlate,"Выполнены, но нет акта с прошлых месяцев","ПТО: оформить и подписать акты"],
    ["nomaster","mid",open.filter(i=>!i.master).length,"Открытые работы без мастера участка","Назначить ответственного мастера"],
    ["noex","mid",open.filter(i=>i.ex==="Не распределено").length,"Открытые работы без исполнителя","ПТО: решить, УК или подрядчик"],
    ["chk","low",all.filter(i=>i.check).length,"Расходятся план, файл исполнителей и Битрикс24","Администратор: сверить и нажать «Сверено»"],
    ["bxstale","low",plan.filter(FLAGS.bxstale[1]).length,"Выполнено, а в Битрикс24 стадия «Запланировано»","Ответственный за Битрикс24: обновить стадии"]]
    .filter(p=>p[2]&&(!mine||["todo_od","prog_od","attn","actlate"].includes(p[0])));
}
function monthRows(all){
  const curM=TODAY.slice(0,7);
  return MONTHS.map(([m,label])=>{const l=all.filter(i=>i.month===m&&i.g!=="cancel");if(!l.length)return null;
    const d=l.filter(isDone).length,op=l.filter(i=>!i.closed).length,na=l.filter(i=>i.g==="noact").length;
    const st=m<curM?(op?"late":na?"wait":"ok"):m===curM?"now":"next";
    return{m,label,l,d,op,na,st,txt:{late:"просрочен",wait:"без акта "+na,ok:"закрыт",now:"идёт сейчас",next:"впереди"}[st]};}).filter(Boolean);
}
function whoRows(plan,W){
  const gm={};
  plan.forEach(i=>{const k=W[1](i),r=gm[k]=gm[k]||{k,n:0,todo:0,prog:0,noact:0,done:0,winter:0,attn:0,od:0};r.n++;r[i.g]++;if(i.overdue)r.od++;});
  return Object.values(gm).map(r=>Object.assign(r,{pct:Math.round((r.noact+r.done)*100/r.n)})).sort((a,b)=>b.od-a.od||a.pct-b.pct);
}
function renderDash(){
  const all=scoped(),plan=all.filter(i=>i.g!=="cancel"),N=plan.length,cancelN=all.length-N,mine=!!(myEx()&&V.scope==="mine");

      'Приняты с актом <b>'+C.done+'</b> ('+pc(C.done)+'%), ждут акта '+C.noact+'.</span></div>'+
      '<span class="money">Оценка плана '+mshort(sum)+' · факт '+mshort(fsum)+(nosum?' · без оценки '+nosum+' '+plural(nosum,"работа","работы","работ"):"")+'</span></div>'+

    '<div class="stages">'+
      card("todo","flow arrow",sx(OD.todo,OD.todo+" — месяц плана прошёл","в срок"))+

    (cancelN?'Снято с плана '+cancelN+' — в проценты не входят. ':'')+'Нажмите на карточку, чтобы открыть список.</p></section>';

  // 2. где проблемы
  const P=probList(all,plan,C,OD,open,actlate,mine);
  const probs='<section class="card"><h3>Где проблемы <span>по важности</span></h3>'+
    '<div class="sub">Красное срывает сроки, жёлтое копится, серое — порядок в данных. Нажмите на строку, чтобы открыть эти работы.</div>'+
    (P.length?'<ul class="plist">'+P.map(p=>'<li class="sev-'+p[1]+'" data-go="prob" data-v="'+p[0]+'" tabindex="0" role="button"><span class="sv"></span><span class="pn">'+p[2]+'</span>'+
      '<span class="pt"><b>'+esc(p[3])+'</b><span>'+esc(p[4])+'</span></span><span class="pa">Показать →</span></li>').join("")+'</ul>':'<div class="empty">Проблем не найдено</div>')+'</section>';

  // 3. по месяцам плана
  const mRows=monthRows(all).map(x=>'<div class="mrow" data-go="month" data-v="'+x.m+'" tabindex="0" role="button" title="'+esc(x.label)+': открыто '+x.op+'"><span class="ml">'+esc(x.label)+'<em class="mb '+x.st+'">'+x.txt+'</em></span>'+stackHtml(x.l)+
      '<span class="mv"><b>'+Math.round(x.d*100/x.l.length)+'%</b><span> · '+x.d+'/'+x.l.length+'</span></span></div>').join("");
  const legend='<div class="legend">'+ORDER.map(k=>'<span><i class="g-'+k+'"></i>'+SHORT[k]+'</span>').join("")+'</div>';
  const months='<section class="card"><h3>По месяцам плана <span>% выполнено · выполнено / в плане</span></h3>'+
    '<div class="sub">«Просрочен» — месяц закончился, а работы не сделаны. «Без акта» — всё сделано, но не все акты оформлены. «Закрыт» — всё принято с актом.</div>'+mRows+legend+'</section>';

  // 4. кто отстаёт
  const W=WHO[V.who]||WHO.ex,rows=whoRows(plan,W);
  const z=n=>n?n:'<span class="z">0</span>';
  const who='<section class="card"><div class="hrow"><h3>Кто отстаёт</h3><div class="seg" role="group" aria-label="Разрез">'+

    '<th title="Месяц плана прошёл, а работа не выполнена">Просрочено</th><th>% выполнено</th></tr></thead><tbody>'+
    rows.map(r=>'<tr data-go="who" data-k="'+(WHO[V.who]?V.who:"ex")+'" data-v="'+esc(r.k)+'" tabindex="0"><td>'+esc(W[2](r.k))+'</td><td>'+r.n+'</td>'+
      ORDER.map(k=>'<td class="st">'+z(r[k])+'</td>').join("")+'<td'+(r.od?' class="bad"':"")+'>'+z(r.od)+'</td>'+
      '<td><span class="pbar"><i><b style="width:'+r.pct+'%"></b></i>'+r.pct+'%</span></td></tr>').join("")+'</tbody></table></div></section>';

  // 5. где именно: адреса и виды работ
  const by={};open.forEach(i=>{const a=by[i.addr]=by[i.addr]||{addr:i.addr,n:0,attn:0,od:0};a.n++;if(i.g==="attn")a.attn++;if(i.overdue)a.od++;});
  const hot=Object.values(by).filter(a=>a.od||a.attn).sort((a,b)=>(b.od+b.attn)-(a.od+a.attn)||b.n-a.n).slice(0,8);
  const cc={};plan.filter(i=>i.overdue).forEach(i=>{const c=i.cat||"Прочее";cc[c]=(cc[c]||0)+1;});
  const cats=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,8),cmax=cats.length?cats[0][1]:1;
  const where='<div class="grid2"><section class="card"><h3>Адреса с проблемами <span>просрочено и нужно решение</span></h3><div class="sub">Где больше всего сорванных работ.</div>'+

      :'<div class="empty">Просроченных работ нет</div>')+'</section>'+

      :'<div class="empty">Просроченных работ нет</div>')+'</section></div>';

  $("view").innerHTML='<div class="head"><h2>Сводка</h2>'+scopeSeg()+'<button class="btn" id="xlsd" type="button">Скачать Excel</button>'+'<span class="faint" style="font-size:12px">сведено '+esc(dmy(S.asof))+

function goTo(k,v,f){
  Object.assign(V,RESET);
  if(k==="stage")V.show=v;
  else if(k==="prob")Object.assign(V,PROB_GO[v]);
  else if(k==="month"){V.month=v;V.show=scoped().some(i=>i.month===v&&!i.closed)?"open":"all";}
  else if(k==="who"&&WHO[f]){V[f]=v;V.show=scoped().some(i=>WHO[f][1](i)===v&&!i.closed)?"open":"all";if(f==="ex"&&myEx()&&v!==myEx())V.scope="all";}
  else if(k==="addr")V.addr=v;
  else if(k==="cat"){V.cat=v;V.flag="od";}
  V.tab="works";renderView();window.scrollTo(0,0);
}
document.addEventListener("click",ev=>{const g=ev.target.closest("[data-go]");if(!g||!$("view"))return;goTo(g.dataset.go,g.dataset.v,g.dataset.k);});
document.addEventListener("keydown",ev=>{if(ev.key!=="Enter"&&ev.key!==" ")return;const g=ev.target.closest&&ev.target.closest("[data-go]");if(g&&g.tagName!=="BUTTON"){ev.preventDefault();g.click();}});
// подсказки на графиках
document.addEventListener("mousemove",ev=>{const t=ev.target.closest&&ev.target.closest("[data-tip]"),tip=$("tip");
  if(!t){tip.hidden=true;return;}tip.textContent=t.dataset.tip;tip.hidden=false;tip.style.left=Math.min(ev.clientX+12,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(ev.clientY-34)+"px";});

/* ---------- работы ---------- */
function baseMatch(i){
  const q=V.q.toLowerCase();
  return(!V.month||i.month===V.month)&&(!V.ex||i.ex===V.ex)&&(!V.addr||i.addr===V.addr)&&(!V.cat||i.cat===V.cat)&&
    (!V.master||(i.master||"—")===V.master)&&(!V.uk||(i.uk||"—")===V.uk)&&(!V.flag||!FLAGS[V.flag]||FLAGS[V.flag][1](i))&&
    (!q||[i.addr,i.work,i.row,i.note,i.src,i.basis,i.act,i.uk,i.master,i.check,i.bxStage,i.status].join(" ").toLowerCase().indexOf(q)>=0);
}
// сначала остановленные и самые просроченные, дальше по ходу работы
const cmpWork=(a,b)=>((b.g==="attn")-(a.g==="attn"))||(b.overdue-a.overdue)||(ORDER.indexOf(a.g)-ORDER.indexOf(b.g))||a.month.localeCompare(b.month)||a.addr.localeCompare(b.addr,"ru");
const opt=(v,l,cur)=>'<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(l)+'</option>';
const isFiltered=()=>!!(V.q||V.month||V.ex||V.addr||V.cat||V.master||V.uk||V.flag||V.show!=="open");
function renderWorks(){
  const base=scoped().filter(baseMatch),list=base.filter(i=>showOK(i,V.show)).sort(cmpWork);
  const hiddenClosed=V.show==="open"&&(V.q||V.addr||V.cat)?base.filter(i=>i.closed).length:0;
  const chips=SHOWS.map(([s,l])=>{const n=base.filter(i=>showOK(i,s)).length,dot=s==="od"?"attn":G_NAME[s]?s:"";
    return'<button type="button" class="chip" data-show="'+s+'" aria-pressed="'+(V.show===s)+'">'+(dot?'<i class="g-'+dot+'"></i>':"")+esc(l)+' <b>'+n+'</b></button>';}).join("");
  const pills=[V.addr&&["addr","адрес: "+V.addr],V.cat&&["cat","вид работ: "+V.cat],V.uk&&["uk","упр. компания: "+(V.uk==="—"?"не указана":V.uk)]].filter(Boolean);
  $("view").innerHTML='<div class="head"><h2>Работы</h2>'+scopeSeg()+'<span class="acts"><button class="btn" id="xlsw" type="button">Скачать Excel</button>'+(isAdmin()?(REAL?'<button class="btn" id="impw" type="button">Загрузить обновление</button>':"")+'<button class="btn" id="addw" type="button">+ Добавить работу</button>':"")+'</span></div>'+
  '<div class="filters"><input class="ctl search" id="fq" type="search" placeholder="Адрес, работа, акт, мастер" value="'+esc(V.q)+'" aria-label="Поиск">'+
  '<select class="ctl" id="fm" aria-label="Месяц">'+opt("","Все месяцы",V.month)+MONTHS.map(m=>opt(m[0],m[1],V.month)).join("")+'</select>'+
  (myEx()&&V.scope==="mine"?"":'<select class="ctl" id="fe" aria-label="Исполнитель">'+opt("","Все исполнители",V.ex)+EXS.map(e=>opt(e,e,V.ex)).join("")+'</select>')+
  '<select class="ctl" id="fma" aria-label="Мастер участка">'+opt("","Все мастера",V.master)+masters().map(m=>opt(m,m==="—"?"Без мастера":m,V.master)).join("")+'</select>'+
  '<select class="ctl" id="ff" aria-label="Дополнительный отбор">'+opt("","Без доп. отбора",V.flag)+Object.entries(FLAGS).filter(([k])=>REAL||k!=="nophoto").map(([k,f])=>opt(k,f[0].charAt(0).toUpperCase()+f[0].slice(1),V.flag)).join("")+'</select></div>'+
  '<div class="chips" role="group" aria-label="Стадия">'+chips+'</div>'+
  (pills.length?'<div class="fpills">'+pills.map(p=>'<span class="fpill">'+esc(p[1])+'<button type="button" data-clr="'+p[0]+'" aria-label="Убрать отбор">×</button></span>').join("")+'</div>':"")+
  '<div class="count"><span>'+list.length+' '+plural(list.length,"работа","работы","работ")+(hiddenClosed?' · <button class="linkbtn" id="showcl" type="button">ещё '+hiddenClosed+' среди закрытых — показать</button>':"")+'</span>'+
    (isFiltered()?'<button class="linkbtn" id="fr" type="button">Сбросить отборы</button>':"")+'</div>'+
  '<div class="list">'+(list.length?list.slice(0,V.limit).map(rowHtml).join("")+(list.length>V.limit?'<button class="more" id="more" type="button">Показать ещё '+Math.min(40,list.length-V.limit)+'</button>':""):'<div class="empty">Ничего не найдено. Измените отборы.</div>')+'</div>';
  bindScope();
  let qt;$("fq").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{if(V.tab!=="works"||!$("fq"))return;V.q=e.target.value.trim();V.limit=40;renderWorks();const f=$("fq");f.focus();f.setSelectionRange(f.value.length,f.value.length);},200);};
  $("fm").onchange=e=>{V.month=e.target.value;renderWorks();};
  if($("fe"))$("fe").onchange=e=>{V.ex=e.target.value;renderWorks();};
  $("fma").onchange=e=>{V.master=e.target.value;renderWorks();};
  $("ff").onchange=e=>{V.flag=e.target.value;renderWorks();};
  document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{V.show=b.dataset.show;V.limit=40;renderWorks();});
  document.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{V[b.dataset.clr]="";renderWorks();});
  if($("fr"))$("fr").onclick=()=>{Object.assign(V,RESET);renderWorks();};
  if($("showcl"))$("showcl").onclick=()=>{V.show="all";renderWorks();};

/* ---------- фото «до» и «после» ---------- */
const PH_T=[["до","До"],["после","После"]];
const PHC={};   // номер фото -> data-URL полного снимка (чтобы не качать повторно)
// снимок перекладывается на холст и сжимается до JPEG: полный (до 1600 px) и миниатюра (160 px)
function phScale(im,max,q){
  const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,k=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q).split(",")[1];
}
function phPrepare(f){
  if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name))return Promise.reject(new Error("«"+f.name+"» — не картинка."));
  if(f.size>30e6)return Promise.reject(new Error("«"+f.name+"» больше 30 МБ."));
  return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);try{res({full:phScale(im,1600,.82),thumb:phScale(im,160,.6),name:f.name});}catch(e){rej(e);}};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("«"+f.name+"»: не удалось открыть снимок (формат не поддерживается, например HEIC). Сохраните его как JPEG."));};
    im.src=u;});
}
const phFull=id=>PHC[id]?Promise.resolve(PHC[id]):call("getPhoto",S.token,id).then(r=>PHC[id]="data:"+r.mime+";base64,"+r.data);

      ps.map(p=>'<button type="button" class="pht" data-pid="'+esc(p.id)+'" aria-label="Открыть фото «'+t[1].toLowerCase()+'»"><img alt="" src="data:image/jpeg;base64,'+esc(p.thumb)+'"></button>').join("")+
      (ed?'<label class="pha'+(D.phBusy?" off":"")+'" title="Добавить фото «'+t[1].toLowerCase()+'»"><span aria-hidden="true">+</span><input type="file" accept="image/*" multiple data-pt="'+t[0]+'" aria-label="Добавить фото «'+t[1].toLowerCase()+'»"'+(D.phBusy?" disabled":"")+'></label>':"")+
      (!ps.length&&!ed?'<span class="faint" style="font-size:12px">нет</span>':"")+'</div></section>';};
  return'<div class="box" id="dph"><h4>Фото</h4>'+(list==null?'<div class="faint" style="font-size:12px">Загружаю…</div>':'<div class="phcols">'+PH_T.map(col).join("")+'</div>')+
    (D.phMsg?'<div class="'+(D.phErr?"imp-err":"faint")+'" style="font-size:12px" role="status">'+esc(D.phMsg)+'</div>':"")+'</div>';
}
function refreshPh(D,it){const el=$("dph");if(el&&V.drawer===D){el.outerHTML=phHtml(D,it);phBind(D,it);}}
function phBind(D,it){
  const root=$("dph");if(!root)return;
  root.querySelectorAll(".pht").forEach(b=>b.onclick=()=>phOpen(D,it,b.dataset.pid));
  root.querySelectorAll("input[data-pt]").forEach(inp=>inp.onchange=()=>{if(inp.files.length)phUpload(D,it,inp.dataset.pt,Array.from(inp.files));});
  if(D.photos===undefined){D.photos=null;
    call("listPhotos",S.token,it.key).then(l=>{D.photos=l;refreshPh(D,it);}).catch(e=>{D.photos=[];D.phMsg=e.message;D.phErr=true;refreshPh(D,it);});}
}
function phUpload(D,it,type,files){
  const total=files.length,fails=[];let n=0;
  D.phBusy=true;D.phErr=false;
  const step=()=>{
    const f=files.shift();
    if(!f){D.phBusy=false;D.phErr=fails.length>0;D.phMsg=fails.length?fails.join(" "):"";
      call("listPhotos",S.token,it.key).then(l=>{D.photos=l;refreshPh(D,it);}).catch(()=>refreshPh(D,it));
      if(n)toast("Фото добавлено: "+n);return;}
    D.phMsg="Загружаю "+(n+fails.length+1)+" из "+total+"…";refreshPh(D,it);
    phPrepare(f).then(x=>call("addPhoto",S.token,it.key,type,x.full,x.thumb,x.name)).then(r=>{S.ph[it.key]=r.counts;S.phDirty=true;n++;})
      .catch(e=>{if(String(e&&e.message).indexOf("SESSION_EXPIRED")>=0){files.length=0;fail(e);}fails.push((e&&e.message)||String(e));}).then(step);
  };
  step();
}

  document.body.appendChild(lb);
  const close=()=>lb.remove();$("lbcl").onclick=close;lb.querySelector(".lbs").onclick=close;$("lbcl").focus();
  phFull(id).then(url=>{if(!$("lbimg"))return;$("lbimg").innerHTML='<img alt="Фото">';$("lbimg").firstChild.src=url;const a=$("lbdl");a.href=url;a.download=(p.name||"foto")+(/\.jpe?g$/i.test(p.name||"")?"":".jpg");a.hidden=false;})

  host.innerHTML='<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="Позиция капремонта"><div class="dh"><div><div class="muted" style="font-size:12px">'+(D.np?"Новая позиция":"Правка позиции")+'</div><h3>'+esc(D.np?"Добавить позицию":cur.addr)+'</h3></div><button class="x" id="dx" type="button" aria-label="Закрыть">×</button></div>'+
   '<div class="db">'+(D.np?inp("ke-addr","Адрес дома",cur.addr,"addr")+inp("ke-work","Что делаем (вид работ)","","work"):'<div class="muted" style="font-size:13px">'+esc(cur.lines.filter(l=>!l.cancelled).map(l=>l.work).join(" · ")||"—")+'</div>'+(cur.manual?'<div class="faint" style="font-size:12px">Добавлена вручную — при новой загрузке перечня остаётся.</div>':'<div class="faint" style="font-size:12px">Правки сохраняются и при новой загрузке перечня: если в файле значение поменяется, останется ваше, а расхождение покажем.</div>'))+
   KR_NUM.map(f=>inp("ke-"+f[0],f[1],cur[f[0]],f[0],' inputmode="decimal"')).join("")+
   inp("ke-pct","Процент выполнения (0–100)",cur.pct,"pct",' inputmode="decimal"')+
   KR_TXT.map(f=>inp("ke-"+f[0],f[1],cur[f[0]],f[0])).join("")+
   inp("ke-start_txt","График начала (01.06.2026, 4 кв. 2026 или 2027)",cur.start_txt,"start_txt")+inp("ke-end_txt","Срок окончания (01.06.2026, 4 кв. 2026 или 2027)",cur.end_txt,"end_txt")+
   '<label class="field" style="flex-direction:row;align-items:center;gap:8px"><input id="ke-vote" type="checkbox" style="width:auto"'+(cur.vote?" checked":"")+'> Нужно переголосование</label>'+
   '<label class="field">Комментарий '+was("note")+'<textarea id="ke-note" maxlength="500">'+esc(cur.note||"")+'</textarea></label>'+
   (D.err?'<div class="imp-err" role="alert">'+esc(D.err)+'</div>':"")+
   '</div><div class="df"><button class="btn primary" id="kesave" type="button" disabled>Сохранить</button><button class="btn" id="kecancel" type="button">Закрыть</button>'+
   (edN?'<button class="btn" id="kereset" type="button" title="Вернуть значения, как в загруженном перечне">Вернуть из файла</button>':"")+(p&&p.manual?'<button class="btn" id="kedel" type="button">Удалить</button>':"")+'<span class="msg" id="kemsg"></span></div></aside>';
  $("dx").onclick=closeDrawer;$("scrim").onclick=closeDrawer;$("kecancel").onclick=closeDrawer;
  const val=id=>$(id).value;
  const patch=()=>{
    const o={},same=(a,b)=>(a==null||a==="")&&(b==null||b==="")||a===b;
    KR_NUM.forEach(f=>{const n=krNum(val("ke-"+f[0]));if(!same(n,cur[f[0]]))o[f[0]]=n;});
    const pt=val("ke-pct").replace(",",".").trim(),pn=pt===""?null:Number(pt);
    if(pn!==null&&(!isFinite(pn)||pn<0||pn>100))throw new Error("Процент: от 0 до 100.");
    if(!same(pn,cur.pct))o.pct=pn;
    KR_TXT.forEach(f=>{const t=val("ke-"+f[0]).replace(/\s+/g," ").trim();if(!same(t,cur[f[0]]))o[f[0]]=t;});
    [["start","start_txt"],["end","end_txt"]].forEach(f=>{const t=val("ke-"+f[1]).replace(/\s+/g," ").trim();if(!same(t,cur[f[1]])){const r=KrImport.parseTermText(t,f[0]);o[f[0]]=r[0];o[f[1]]=r[1];}});
    if($("ke-vote").checked!==!!cur.vote)o.vote=$("ke-vote").checked;
    const nt=val("ke-note").trim();if(!same(nt,cur.note))o.note=nt;
    if(D.np){o.addr=val("ke-addr").replace(/\s+/g," ").trim();o.work=val("ke-work").replace(/\s+/g," ").trim();}
    return o;
  };
  const check=()=>{try{const o=patch();$("kesave").disabled=D.busy||(D.np?!(o.addr&&o.work):!Object.keys(o).length);$("kemsg").textContent="";}catch(e){$("kesave").disabled=true;$("kemsg").textContent=e.message;}};
  host.querySelectorAll("input,textarea").forEach(el=>{el.addEventListener("input",check);el.addEventListener("change",check);});
  check();
  const done=(r,msg)=>{
    D.busy=false;
    if(r.pos){const L=S.kr.data.positions,i=L.findIndex(x=>x.pk===r.pos.pk);if(i>=0)L[i]=Object.assign({},L[i],r.pos);else if(D.np)L.push(r.pos);}
    S.krView.open=S.krView.open||{};toast(msg);V.drawer=null;$("dr").innerHTML="";renderKr();load(true);
  };
  const bad=er=>{D.busy=false;D.err=(er&&er.message)||String(er);if(String(D.err).indexOf("SESSION_EXPIRED")>=0){fail(er);return;}if(V.drawer===D)renderKrEdit(host);};
  $("kesave").onclick=()=>{
    let o;try{o=patch();}catch(e){return bad(e);}
    D.busy=true;$("kesave").disabled=true;$("kemsg").textContent="Записываю…";
    if(D.np){o.hk=KrImport.houseKey(o.addr);call("addCapitalPosition",S.token,o).then(r=>done(r,"Позиция добавлена")).catch(bad);}
    else call("editCapital",S.token,cur.pk,o).then(r=>done(r,r.changed?"Сохранено":"Изменений нет")).catch(bad);
  };
  if($("kereset"))$("kereset").onclick=()=>{if(!confirm("Вернуть значения из загруженного перечня? Ваши правки по этой позиции пропадут."))return;D.busy=true;call("resetCapitalEdits",S.token,cur.pk).then(r=>done(r,"Значения возвращены из файла")).catch(bad);};
  if($("kedel"))$("kedel").onclick=()=>{if(!confirm("Удалить эту позицию?"))return;D.busy=true;call("deleteCapitalPosition",S.token,cur.pk).then(()=>{const L=S.kr.data.positions,i=L.findIndex(x=>x.pk===cur.pk);if(i>=0)L.splice(i,1);D.busy=false;toast("Позиция удалена");V.drawer=null;$("dr").innerHTML="";renderKr();load(true);}).catch(bad);};
}
function renderKrUpload(host){
  if(!isAdmin()){closeDrawer();return;}
  const D=V.drawer,r=D.res,E=S.kr&&S.kr.data;D.files=D.files||{};
  const mlnR=n=>(n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн ₽";
  const prev=r?'<div class="box"><h4>Что получится</h4><ul class="imp-info"><li>Позиций: <b>'+r.info.positions+'</b>, домов: '+r.info.houses+', сумма КР '+mlnR(r.info.kr)+(E&&r.info.fromList?' <span class="faint">(сейчас '+E.positions.length+' поз., '+mlnR(E.positions.reduce((a,p)=>a+(p.kr||0),0))+')</span>':"")+'</li>'+
    '<li>Подтопления: '+(r.data.flood?'в реестре '+r.info.floodRegister+' домов, из них в программе <b>'+r.info.floodHouses+'</b>':"реестр не загружен")+'</li>'+
    (r.info.kept&&(r.info.kept.edits||r.info.kept.manual||r.info.kept.lost)?'<li>Ваши правки сохранятся: изменённых полей <b>'+r.info.kept.edits+'</b>'+(r.info.kept.conflicts?', из них в новом файле значение изменилось у '+r.info.kept.conflicts+' (останется ваше)':"")+(r.info.kept.manual?'; добавленных вручную позиций: <b>'+r.info.kept.manual+'</b>':"")+(r.info.kept.lost?'<br><b>Позиций с правками нет в новом файле: '+r.info.kept.lost+'</b> — они пропадут из списка':"")+'</li>':"")+
    '<li>Перечень: '+(r.info.fromList?"новый файл":"остаётся прежний")+' · реестр подтоплений: '+(r.info.fromFlood?"новый файл":"остаётся прежний")+'</li></ul>'+r.warnings.map(w=>'<div class="imp-err" role="alert">'+esc(w)+'</div>').join("")+'</div>':"";
  host.innerHTML='<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="Данные капремонта"><div class="dh"><h3>Данные капремонта</h3><button class="x" id="dx" type="button" aria-label="Закрыть">×</button></div>'+
    '<div class="db"><p class="muted" style="margin:0;font-size:13px">Нужен хотя бы один файл. Если выбрать только реестр подтоплений, перечень останется прежним, и наоборот. Файлы читаются в вашем браузере и никуда не отправляются, на сервер уходит только итог.</p>'+
    '<label class="field">Перечень работ капремонта (.xls, .xlsx)<input type="file" id="kl" accept=".xls,.xlsx"></label>'+
    '<label class="field">Реестр подтоплений (.html)<input type="file" id="kf" accept=".html,.htm,text/html"></label>'+
    '<label class="field">Перечень сохранён (дата)<input type="date" id="kd" value="'+esc(D.date||"")+'"></label>'+
    '<button class="btn" id="kgo" type="button" disabled>Прочитать и показать</button>'+(D.err?'<div class="imp-err" role="alert">'+esc(D.err)+'</div>':"")+prev+'</div>'+
    '<div class="df"><button class="btn primary" id="ksave" type="button"'+(r&&!D.busy?"":" disabled")+'>Сохранить</button><button class="btn" id="kcancel" type="button">Закрыть</button><span class="msg" id="kmsg"></span></div></aside>';
  $("dx").onclick=closeDrawer;$("scrim").onclick=closeDrawer;$("kcancel").onclick=closeDrawer;
  const ready=()=>{$("kgo").disabled=D.busy||!(D.files.list||D.files.flood)||(D.files.list&&!D.date);};
  $("kl").onchange=e=>{const f=e.target.files[0];if(!f)return;D.files.list=f;D.res=null;if(!D.date)D.date=isoLocal(f.lastModified);$("kd").value=D.date;ready();};
  $("kf").onchange=e=>{D.files.flood=e.target.files[0]||null;D.res=null;ready();};
  $("kd").onchange=e=>{D.date=e.target.value;ready();};
  ready();
  $("kgo").onclick=()=>{
    D.busy=true;D.err="";D.res=null;$("kgo").disabled=true;$("kmsg").textContent="Читаю файлы…";
    Promise.all([D.files.list?loadXlsx():Promise.resolve(null),D.files.list?D.files.list.arrayBuffer():null,D.files.flood?D.files.flood.text():null])
      .then(a=>new Promise(res=>setTimeout(()=>res(a),30)))
      .then(a=>{if(a[0])TrackerMerge.setLib(a[0]);D.res=KrImport.build({tm:TrackerMerge,list:a[1],flood:a[2],existing:E,today:TODAY,saved:D.date||(E&&E.saved)||TODAY});D.busy=false;if(V.drawer===D)renderKrUpload(host);})
      .catch(er=>{D.busy=false;D.err=(er&&er.message)||String(er);if(V.drawer===D)renderKrUpload(host);});
  };
  $("ksave").onclick=()=>{D.busy=true;$("ksave").disabled=true;$("kmsg").textContent="Записываю…";
    call("saveCapital",S.token,JSON.stringify(D.res.data)).then(r=>{toast("Данные капремонта сохранены: "+r.positions+" поз., подтопления в "+r.flood+" "+plural(r.flood,"доме","домах","домах"));S.kr=undefined;closeDrawer();if(V.tab==="kr")renderKr();})
      .catch(er=>{D.busy=false;D.err=(er&&er.message)||String(er);if(String(D.err).indexOf("SESSION_EXPIRED")>=0){fail(er);return;}if(V.drawer===D)renderKrUpload(host);});};
}

/* ---------- вопросы, журнал, пользователи ---------- */
function renderIssues(){
  const open=S.issues.filter(i=>!i.done).length;
  $("view").innerHTML='<div class="head"><h2>Открытые вопросы</h2><span class="muted">'+open+' из '+S.issues.length+' открыто</span></div>'+
  (isAdmin()?'<form class="card" id="qf" style="display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:12px">'+
    '<label class="field">Новый вопрос<input id="qt" maxlength="1000" placeholder="Что нужно решить"></label><label class="field">Ответственный<input id="qr" maxlength="80"></label>'+
    '<label class="field">Срок<input id="qd" maxlength="40" placeholder="до 15.10"></label><button class="btn primary" type="submit">Добавить</button></form>':"")+
  '<div class="list"><ul class="ilist">'+
  S.issues.slice().sort((a,b)=>a.done-b.done).map(i=>'<li class="'+(i.done?"done":"")+'"><input type="checkbox" data-iss="'+i.num+'"'+(i.done?" checked":"")+(isAdmin()?"":" disabled")+' aria-label="Вопрос решён">'+
   '<div><div class="t">'+esc(i.text)+'</div><div class="meta"><span>'+esc(i.resp)+'</span><span>срок: '+esc(i.term)+'</span>'+(i.done&&i.by?'<span>закрыл '+esc(i.by)+' '+when(i.at)+'</span>':"")+'</div></div></li>').join("")+'</ul></div>';
  if($("qf"))$("qf").onsubmit=e=>{e.preventDefault();const t=$("qt").value.trim();if(!t){toast("Опишите вопрос");return;}
    call("addIssue",S.token,{text:t,resp:$("qr").value,term:$("qd").value}).then(is=>{S.issues=is;toast("Вопрос добавлен");renderIssues();}).catch(fail);};
  document.querySelectorAll("[data-iss]").forEach(c=>c.onchange=()=>{c.disabled=true;call("setIssue",S.token,+c.dataset.iss,c.checked).then(()=>load(true)).catch(e=>{c.checked=!c.checked;c.disabled=false;fail(e);});});
}
function renderLog(){
  $("view").innerHTML='<div class="head"><h2>Журнал изменений</h2><span class="muted">последние '+S.log.length+'</span></div><div class="list">'+
  (S.log.length?'<ul class="ilist loglist">'+S.log.map(l=>'<li><div><div class="t"><b>'+esc(l.addr||"Вопрос")+'</b> · '+esc(l.work.slice(0,90))+'</div><div class="meta"><span>'+when(l.at)+'</span><span>'+esc(l.by)+'</span><span>'+esc(l.what)+(l.from?': '+esc((l.what==="Перенос срока"?mname(l.from):l.from).slice(0,60))+' →':":")+' <b>'+esc((l.what==="Перенос срока"?mname(l.to):l.to).slice(0,80))+'</b></span></div></div></li>').join("")+'</ul>':'<div class="empty">Изменений пока нет.</div>')+'</div>';
}
function renderUsers(){
  if(!isAdmin()){V.tab="dash";return renderView();}
  $("view").innerHTML='<div class="head"><h2>Пользователи</h2></div><div class="list" id="ul"><div class="empty">Загрузка…</div></div>'+
   '<form class="uform card" id="uf"><input type="hidden" id="uo"><label class="field">Имя<input id="un" required></label><label class="field">Роль<select id="ur">'+ROLES.map(r=>opt(r,r,"УК")).join("")+'</select></label>'+
   '<label class="field">PIN (4–8 цифр)<input id="up" inputmode="numeric" maxlength="8" placeholder="не менять"></label><label class="field">ID в Битрикс24<input id="ub" inputmode="numeric" maxlength="12" placeholder="для входа из портала"></label><label class="chk"><input type="checkbox" id="ua" checked> Активен</label>'+
   '<button class="btn primary" type="submit">Сохранить</button></form>'+
   '<p class="faint" style="font-size:12px;max-width:70ch">Администратор меняет всё. УК и Подрядчики отмечают статус и комментарий только в своих работах. Просмотр — без изменений. PIN хранится в таблице в виде хэша. Сотрудник, впервые открывший трекер из Битрикс24, появляется здесь сам с ролью «Просмотр» — назначьте ему роль. ID в Битрикс24 — число из адреса профиля: …/company/personal/user/<b>15</b>/.</p>';
  const draw=us=>{$("ul").innerHTML='<table class="utable"><thead><tr><th>Имя</th><th>Роль</th><th>Вход</th><th>Статус</th><th></th></tr></thead><tbody>'+
    us.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.role)+'</td><td class="muted">'+[u.bxId?"Битрикс24 · "+esc(u.bxId):"",u.hasPin?"PIN":""].filter(Boolean).join(" · ")+'</td><td>'+(u.active?"активен":'<span class="faint">отключён</span>')+'</td><td><button class="linkbtn" data-u="'+esc(u.name)+'" data-r="'+esc(u.role)+'" data-a="'+u.active+'" data-b="'+esc(u.bxId||"")+'" type="button">Изменить</button></td></tr>').join("")+'</tbody></table>';
    document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{$("uo").value=b.dataset.u;$("un").value=b.dataset.u;$("ur").value=b.dataset.r;$("ua").checked=b.dataset.a==="true";$("ub").value=b.dataset.b;$("up").value="";$("un").focus();});};
  call("listUsers",S.token).then(draw).catch(fail);
  $("uf").onsubmit=e=>{e.preventDefault();call("saveUser",S.token,{oldName:$("uo").value,name:$("un").value.trim(),role:$("ur").value,active:$("ua").checked,pin:$("up").value.trim(),bxId:$("ub").value.trim()})
    .then(us=>{draw(us);toast("Сохранено");$("uf").reset();$("uo").value="";}).catch(fail);};
}

/* ---------- старт ---------- */
if(BOOT&&BOOT.session){S.token=BOOT.session.token;S.user=BOOT.session.user;saveSess();V.scope=myEx()?"mine":"all";load();}
else if(S.token)load();else renderLogin();
})();
</script>
